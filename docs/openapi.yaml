      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200": { description: MFA requirement enabled, with grace period if setup is still pending }
        "404": { description: User not found }

  /users/{id}/mfa/clear:
    post:
      summary: Clear the MFA requirement for a user (admin)
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200": { description: MFA requirement cleared }
        "404": { description: User not found }

  /users/{id}/mfa/grace:
    post:
      summary: Extend the MFA setup grace period for a user (admin)
      tags: [Users]
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200": { description: MFA grace period extended }
        "404": { description: User not found }
