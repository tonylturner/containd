openapi: "3.0.3"
info:
  title: containd API
  version: "1.0.0"
  description: |
    REST API for containd -- an ICS/OT firewall management platform.
    Provides configuration, monitoring, and security services for
    industrial control system network environments.

    All paths below are relative to the /api/v1 base path.
    Authenticated endpoints require a JWT obtained via POST /auth/login.
  license:
    name: Apache-2.0

servers:
  - url: /api/v1
    description: Default API base path

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT from POST /auth/login. Send as Authorization header
        or via the token cookie set automatically on login.

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    LoginResponse:
      type: object
      properties:
        token: { type: string, description: Signed JWT }
        expiresAt: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    MFALoginChallenge:
      type: object
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        mfaMethod: { type: string, example: totp }
        mfaChallengeToken: { type: string }
        user: { $ref: "#/components/schemas/User" }

    MFAVerifyLoginRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string }
        code: { type: string }

    MFAEnrollResponse:
      type: object
      properties:
        secret: { type: string }
        otpauthURL: { type: string, format: uri }
        qrDataURL: { type: string }
        challengeToken: { type: string }

    MFAEnableRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: { type: string }
        code: { type: string }

    MFADisableRequest:
      type: object
      required: [currentPassword, code]
      properties:
        currentPassword: { type: string, format: password }
        code: { type: string }

    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, view] }
        mustChangePassword: { type: boolean }
        mfaEnabled: { type: boolean }
        mfaRequired: { type: boolean }
        mfaGraceUntil: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateUserRequest:
      type: object
      required: [username, role, password]
      properties:
        username: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        role: { type: string, enum: [admin, view] }
        password: { type: string, format: password }

    ErrorResponse:
      type: object
      properties:
        error: { type: string, description: Human-readable error message }
        detail: { type: string, description: Optional additional context }

    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        component: { type: string, example: mgmt }
        build: { type: string }
        commit: { type: string }
        hostname: { type: string }
        time: { type: string, format: date-time }
        iec104Enforcement: { $ref: "#/components/schemas/IEC104Enforcement" }
        ipv4Forwarding:
          type: string
          enum: [enabled, disabled, unknown]
          description: >
            IPv4 forwarding state read by the engine from
            /proc/sys/net/ipv4/ip_forward in its network namespace.
            `unknown` means the sysctl could not be read or the management
            API could not reach the engine.

    IEC104Enforcement:
      type: object
      required: [active, healthy, reason]
      description: >
        IEC 60870-5-104 enforcement state of the running engine. The
        endpoint keeps HTTP 200 liveness whatever this object says.
        Inactive with no fault is {active: false, healthy: true, reason: ""}.
        If the management plane cannot reach the engine it reports
        {active: false, healthy: false, reason: "engine unreachable"}; it
        never reports healthy without the engine.
      properties:
        active:
          type: boolean
          description: >
            At least one IEC104 enforce envelope is loaded in the runtime.
            This describes the applied policy, not the saved config.
        healthy:
          type: boolean
          description: >
            False after a queue bind, verdict submission, reset send,
            reset injector or bounded-worker failure. IEC104 envelope
            traffic then fails closed until readiness returns.
        reason: { type: string, description: Machine-readable cause when unhealthy, else empty }
      example: { active: true, healthy: true, reason: "" }

    PcapFilter:
      type: object
      description: >
        Packet filter. Port matches either the TCP/UDP source or destination
        port; it is not valid with proto icmp.
      properties:
        src: { type: string, description: Source IPv4 address or CIDR }
        dst: { type: string, description: Destination IPv4 address or CIDR }
        proto: { type: string, enum: [any, tcp, udp, icmp], default: any }
        port:
          type: string
          pattern: '^[0-9]+(-[0-9]+)?$'
          example: "2404"
          description: Single port 1–65535 or inclusive range, e.g. 1000-2000

    PcapConfig:
      type: object
      description: >
        Capture selections are resolved when capture starts against the
        running interface and zone configuration. Interface and zone
        selections are unioned and deduplicated.
      properties:
        enabled: { type: boolean }
        interfaces:
          type: array
          items: { type: string }
          description: Logical interface name or existing kernel device name
        zones:
          type: array
          items: { type: string }
          description: Capture every configured interface assigned to these zones
        snaplen: { type: integer, minimum: 0 }
        maxSizeMB: { type: integer, minimum: 0 }
        maxFiles: { type: integer, minimum: 0 }
        mode: { type: string, enum: [rolling, once] }
        promisc: { type: boolean }
        bufferMB: { type: integer, minimum: 0 }
        rotateSeconds: { type: integer, minimum: 0 }
        filePrefix: { type: string }
        filter: { $ref: "#/components/schemas/PcapFilter" }
        forwardTargets:
          type: array
          items: { type: object, additionalProperties: true }

    PcapStatus:
      type: object
      properties:
        running: { type: boolean }
        interfaces:
          type: array
          items: { type: string }
          description: Resolved kernel device names
        startedAt: { type: string, format: date-time }
        lastError: { type: string }

    DashboardResponse:
      type: object
      properties:
        health: { $ref: "#/components/schemas/HealthResponse" }
        counts:
          type: object
          properties:
            assets: { type: integer }
            zones: { type: integer }
            interfaces: { type: integer }
            rules: { type: integer }
        eventStats:
          type: object
          properties:
            total: { type: integer }
            idsAlerts: { type: integer }
            modbusWrites: { type: integer }
            avDetections: { type: integer }
            avBlocks: { type: integer }
        services: { type: object }
        user: { type: object }
        lastActivity: { $ref: "#/components/schemas/AuditRecord" }

    Event:
      type: object
      properties:
        id: { type: integer, format: uint64 }
        flowId: { type: string }
        proto: { type: string }
        kind: { type: string }
        attributes: { type: object, additionalProperties: true }
        timestamp: { type: string, format: date-time }
        srcIp: { type: string }
        dstIp: { type: string }
        srcPort: { type: integer }
        dstPort: { type: integer }
        transport: { type: string, enum: [tcp, udp] }
        hash: { type: string }

    FlowSummary:
      type: object
      properties:
        flowId: { type: string }
        session_id:
          type: string
          description: >
            IEC104 session incarnation that groups this rollup (both wire
            directions of one connection). Absent for non-IEC flows.
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        srcIp: { type: string }
        dstIp: { type: string }
        srcPort: { type: integer }
        dstPort: { type: integer }
        transport: { type: string }
        application: { type: string }
        eventCount: { type: integer, format: uint64 }
        avDetected: { type: boolean }
        avBlocked: { type: boolean }

    FirewallRule:
      type: object
      required: [id, action]
      properties:
        id: { type: string }
        description: { type: string }
        sourceZones: { type: array, items: { type: string } }
        destZones: { type: array, items: { type: string } }
        sources: { type: array, items: { type: string }, description: CIDRs }
        destinations: { type: array, items: { type: string }, description: CIDRs }
        protocols:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, example: tcp }
              port: { type: string, example: "2404", description: Single port or range "1000-2000" }
        identities: { type: array, items: { type: string } }
        ics: { $ref: "#/components/schemas/ICSPredicate" }
        action: { type: string, enum: [ALLOW, DENY] }
        log: { type: boolean }

    ICSPredicate:
      type: object
      additionalProperties: false
      description: |
        ICS predicate of a firewall rule. Decoding is strict: unknown keys
        (exact spelling) and duplicate keys are rejected. `{}` is a pure
        L3/L4 rule. Semantic values need `protocol`. OR within a list, AND
        across fields; an absent field matches any value.

        IEC 60870-5-104 (`protocol: iec104`):
        - `typeIds`, `classes`, `ca` and `ioa` are iec104-only. `null`, `[]`
          and null items are rejected; omit the field to match any value.
          Numbers must be JSON integers.
        - `functionCode`, `unitId`, `addresses`, `objectClasses` and
          `writeOnly` are rejected on iec104 when present at all, so
          `"writeOnly": false` is an error.
        - IEC104 rules match the session tuple (client = TCP opener,
          server port 2404) whatever the wire direction; `direction` selects
          the half. Inside the IEC104 envelope only iec104 rules are
          evaluated, in order, and no match is DENY regardless of
          `firewall.defaultAction`.
        - An enforce ALLOW rule may name only Type IDs with a decoder
          descriptor (1, 3, 13, 30, 31, 45-51, 58-64, 70, 100-103, 105, 107) and
          not the `unknown` class. Broadcast (CA 65535) and malformed
          objects never match an ALLOW.
        - IEC104 enforce (effective mode: rule `mode`, else
          `dataplane.dpiMode`, else learn) is rejected on save, candidate,
          commit and import unless `dataplane.dpiEnabled` is true,
          `dataplane.dpiIcsProtocols.iec104` is not false,
          `dataplane.nfqueueGroup` is non-zero (NFQUEUE capture), and no
          IP/CIDR `dataplane.dpiExclusions` entry overlaps an enforce rule's
          sources or destinations.
      properties:
        protocol:
          type: string
          enum: [modbus, dnp3, cip, s7comm, mms, bacnet, opcua, iec104]
        functionCode:
          description: >
            Function/service codes (not iec104). Accepted forms: integer
            array, a single integer, numeric strings, an index-keyed
            object, legacy base64 string, or null.
          oneOf:
            - { type: array, items: { type: integer, minimum: 0, maximum: 255 } }
            - { type: integer, minimum: 0, maximum: 255 }
            - { type: string }
            - { type: object, additionalProperties: true }
          nullable: true
        unitId: { type: integer, minimum: 0, maximum: 255, description: Modbus unit id }
        addresses: { type: array, items: { type: string }, description: Register/address values or ranges (not iec104) }
        objectClasses: { type: array, items: { type: integer }, description: CIP object classes (cip only) }
        readOnly:
          type: boolean
          description: >
            Match read-only traffic only. On iec104: monitor-class responses,
            GI (100) and read (102) requests, end of initialization (70),
            S-frames and U-frames. false is no constraint, never "writes
            only".
        writeOnly: { type: boolean, description: Match writes only (not iec104) }
        direction: { type: string, enum: [request, response] }
        mode: { type: string, enum: [learn, enforce], description: Overrides dataplane.dpiMode for this rule }
        typeIds:
          type: array
          minItems: 1
          items: { type: integer, minimum: 1, maximum: 255 }
          description: IEC104 Type IDs, a numeric array (never base64)
        classes:
          type: array
          minItems: 1
          items: { type: string, enum: [monitor, control, system, unknown] }
        ca:
          type: array
          minItems: 1
          items: { type: integer, minimum: 0, maximum: 65534 }
          description: IEC104 common addresses; 65535 (broadcast) is rejected
        ioa:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/IOARange" }
          description: IEC104 information object address ranges; duplicates and overlaps are rejected
      example:
        protocol: iec104
        typeIds: [46]
        classes: [control]
        direction: request
        ca: [1]
        ioa: [{ start: 65536, end: 65567 }]
        mode: enforce

    IOARange:
      type: object
      additionalProperties: false
      required: [start, end]
      description: Closed range, start <= end; both keys are required, so 0 is never "missing"
      properties:
        start: { type: integer, minimum: 0, maximum: 16777215 }
        end: { type: integer, minimum: 0, maximum: 16777215 }

    AuditRecord:
      type: object
      properties:
        id: { type: integer, format: int64 }
        timestamp: { type: string, format: date-time }
        actor: { type: string }
        source: { type: string, description: "Origin: ui, api, ssh, or cli" }
        action: { type: string }
        target: { type: string }
        result: { type: string, enum: [success, failure] }
        detail: { type: string }

    PolicyAnalysis:
      type: object
      properties:
        rules: { type: array, items: { type: object }, description: Auto-generated allowlist rules }
        profiles:
          type: array
          items: { $ref: "#/components/schemas/LearnedProfile" }
        stats:
          type: object
          properties:
            events: { type: array, items: { type: object } }
            flows: { type: array, items: { type: object } }
            protocols: { type: object, additionalProperties: { type: integer } }
            duration: { type: string, description: Duration of the capture }
            packetCount: { type: integer }
        eventSummary: { type: object, additionalProperties: { type: integer }, description: Event counts keyed by protocol }

    LearnedProfile:
      type: object
      properties:
        protocol: { type: string }
        sourceIP: { type: string }
        destIP: { type: string }
        unitIDs: { type: object, additionalProperties: { type: boolean } }
        functionCodes: { type: object, additionalProperties: { type: boolean } }
        addresses: { type: object, additionalProperties: { type: boolean } }
        readSeen: { type: boolean }
        writeSeen: { type: boolean }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }

    ICSTemplateInfo:
      type: object
      properties:
        name: { type: string, example: modbus_read_only }
        description: { type: string }
        protocol: { type: string, example: modbus }
        parameters:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              label: { type: string }
              type: { type: string, enum: [text, number, select] }
              required: { type: boolean }
              placeholder: { type: string }
              help: { type: string }

    ApplyICSTemplateRequest:
      type: object
      required: [template]
      properties:
        template: { type: string, description: "Template name (e.g. modbus_read_only, dnp3_secure_operations)" }
        sourceZones: { type: array, items: { type: string } }
        destZones: { type: array, items: { type: string } }
        source_zones: { type: array, items: { type: string }, deprecated: true }
        dest_zones: { type: array, items: { type: string }, deprecated: true }
        preview: { type: boolean, description: "When true, generate rules without saving them to candidate config" }
        parameters:
          type: object
          additionalProperties: { type: string }
          description: "Template parameter map used by the UI"
        params:
          type: object
          properties:
            ranges: { type: array, items: { type: string }, description: Register address ranges (legacy modbus_register_guard shape) }

    RulePreviewResponse:
      type: object
      properties:
        match_count: { type: integer, description: Number of recent events matching the rule }
        sample_matches:
          type: array
          items: { $ref: "#/components/schemas/Event" }
          description: Up to 50 sample matching events
        time_range:
          type: object
          nullable: true
          properties:
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
        total_events: { type: integer, description: Total events evaluated }

    EngineConfig:
      type: object
      properties:
        dpiMode:
          type: string
          enum: [learn, enforce]
          description: >
            DPI operational mode. "learn" passively observes traffic without blocking.
            "enforce" actively blocks traffic that violates ICS policy rules.
        dpiProtocols:
          type: object
          additionalProperties: { type: boolean }
          description: 'IT protocol enable/disable map (e.g., {"dns": true, "tls": true})'
        dpiIcsProtocols:
          type: object
          additionalProperties: { type: boolean }
          description: >
            ICS protocol enable/disable map. Keys: modbus, dnp3, cip, s7comm, mms, bacnet, opcua, iec104.
            An absent key is enabled; only an explicit false disables a decoder.
            A config with IEC104 enforce rules is rejected if iec104 is false.
          example:
            modbus: true
            dnp3: true
            cip: false
            s7comm: false
            mms: true
            bacnet: false
            opcua: false
            iec104: true

  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema: { type: string }

paths:
  # ── Health (unauthenticated) ──────────────────────────────────────
  /health:
    get:
      summary: Health check
      description: >
        Always returns HTTP 200 for liveness. `ipv4Forwarding` reports the
        forwarding sysctl state observed in the engine's network namespace,
        or `unknown` if that state cannot be read.
      security: []
      tags: [System]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }

  # ── Auth ──────────────────────────────────────────────────────────
  /auth/login:
    post:
      summary: Authenticate and obtain a JWT
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Login successful or MFA challenge required
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/LoginResponse" }
                  - { $ref: "#/components/schemas/MFALoginChallenge" }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Rate-limited
          headers:
            Retry-After: { schema: { type: integer } }

  /auth/login/mfa:
    post:
      summary: Complete login with an MFA code
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFAVerifyLoginRequest" }
      responses:
        "200":
          description: MFA verified and session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          description: Invalid or expired challenge token or authentication code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /auth/logout:
    post:
      summary: Invalidate the current session
      security: []
      tags: [Auth]
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      summary: Update current user profile
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/User" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }

  /auth/me/mfa/enroll:
    post:
      summary: Start TOTP MFA enrollment for the current user
      tags: [Auth]
      responses:
        "200":
          description: Enrollment material for a new authenticator app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollResponse" }
        "409": { description: MFA already enabled }
        "403": { description: MFA setup required sessions may access this endpoint even when other API access is restricted }

  /auth/me/mfa/enable:
    post:
      summary: Enable TOTP MFA for the current user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFAEnableRequest" }
      responses:
        "200": { description: MFA enabled }
        "401": { description: Invalid or expired challenge token or authentication code }
        "409": { description: MFA already enabled }
        "403": { description: MFA setup required sessions may access this endpoint even when other API access is restricted }

  /auth/me/mfa/disable:
    post:
      summary: Disable TOTP MFA for the current user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MFADisableRequest" }
      responses:
        "200": { description: MFA disabled }
        "401": { description: Current password or authentication code invalid }
        "409": { description: MFA is required for this account and cannot be self-disabled }

  # ── Dashboard ─────────────────────────────────────────────────────
  /dashboard:
    get:
      summary: Aggregated dashboard data
      tags: [Dashboard]
      responses:
        "200":
          description: Dashboard payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardResponse" }

  # ── Config ────────────────────────────────────────────────────────
  /config:
    get:
      summary: Get running configuration
      tags: [Config]
      responses:
        "200":
          description: Full device configuration
          content:
            application/json: { schema: { type: object } }
    post:
      summary: Replace running configuration (admin)
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
      responses:
        "200": { description: Configuration saved }
        "403": { description: Admin role required }

  /config/candidate:
    get:
      summary: Get the candidate configuration
      tags: [Config]
      responses:
        "200":
          description: Candidate configuration
          content:
            application/json: { schema: { type: object } }
        "404": { description: No candidate configuration }
    post:
      summary: Save a candidate configuration (admin)
      description: >
        Validates and stages the whole config without activating it. ICS
        predicates decode strictly, and IEC104 enforce that cannot activate
        is rejected (see ICSPredicate).
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
      responses:
        "200": { description: Candidate saved }
        "400":
          description: Invalid JSON or configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { description: Admin role required }

  /config/commit:
    post:
      summary: Commit candidate config and apply to data plane
      description: >
        Promotes the candidate to running and applies it. Check
        GET /health iec104Enforcement afterwards: a runtime queue or reset
        injector failure keeps the config and reports unhealthy.
      tags: [Config]
      responses:
        "200":
          description: Commit applied
          headers:
            X-Containd-Warnings:
              description: >
                One header value per warning. When the config spans multiple
                zone-assigned interface devices and IPv4 forwarding is
                disabled, includes "ipv4 forwarding is disabled
                (net.ipv4.ip_forward=0); routed traffic will not pass".
              schema: { type: string }
        "400": { description: Candidate configuration is invalid }
        "403": { description: Admin role required }

  /config/import:
    post:
      summary: Import a configuration as running (admin)
      description: >
        Validates and saves the whole config as the running config. It does
        not activate it: the data plane keeps its current policy until
        POST /config/commit. After importing, commit and then check
        GET /health iec104Enforcement. Validation is the same as for a
        candidate.
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json: { schema: { type: object } }
      responses:
        "200":
          description: Configuration saved, not activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [imported] }
        "400":
          description: Invalid JSON or configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { description: Admin role required }
        "413": { description: Body larger than 10 MiB }

  /config/rollback:
    post:
      summary: Roll back to previous configuration
      tags: [Config]
