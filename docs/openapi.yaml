            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      parameters:
      - name: ip
        in: path
        required: true
        schema: {type: string}
  /events/{id}:
    get:
      summary: Get retained event by ID
      tags: [Events]
      description: Searches retained general and evidence banks; not durable history.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Event'}
        '404':
          description: Event not retained
