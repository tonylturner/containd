  /dataplane/ics-coverage:
    get:
      summary: ICS rule coverage of the candidate and the applied rules
      tags: [Dataplane]
      description: >-
        Readable by any authenticated user; carries no ruleset. Each side is reported independently:
        an invalid candidate sets candidateError and omits candidate, an unreadable engine sets
        engineStatusError and omits applied. Compare candidate and applied without reasons marked
        runtime and without matches.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidate:
                    type: array
                    items: {$ref: '#/components/schemas/ICSCoverageRule'}
                    description: Static coverage of the candidate, in rule ID order; empty without ICS rules.
                  candidateError: {type: string, description: Why the candidate does not validate.}
                  applied:
                    type: array
                    items: {$ref: '#/components/schemas/ICSCoverageRule'}
                    description: Live coverage of the rules in force; after a failed apply, the previous rules.
                  appliedAt: {type: string, format: date-time, description: Time of the last apply attempt; omitted before any.}
                  applyError: {type: string, description: Error of the last apply attempt, if it failed.}
                  engineStatusError: {type: string}
  /dataplane/blocks/host:
    post:
      summary: Block an IPv4 host immediately (admin)
      tags: [Dataplane]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BlockHostRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
  /dataplane/blocks/flow:
    post:
      summary: Block an IPv4 flow immediately (admin)
      tags: [Dataplane]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BlockFlowRequest'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
  /dataplane/ruleset:
    get:
      summary: Preview candidate ruleset and engine status (admin)
      tags: [Dataplane]
      description: >-
        Compiles candidate without applying it, using candidate enforcement settings,
        the engine's reserved management access and live queue ownership sampled at request time.
        Later queue ownership changes may change IEC 104 steering before commit.
        A live engine is required; no default-compiler fallback is used.
        When candidate enforcement is disabled, no nftables ruleset is compiled or returned;
        runtime.reason states that enforcement is disabled and nothing would be applied.
        engineStatus describes the last apply separately from the preview runtime sample.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [snapshot, runtime]
                properties:
                  snapshot: {$ref: '#/components/schemas/RulesSnapshot'}
                  ruleset: {type: string, description: Compiled nftables ruleset; omitted when candidate enforcement is disabled}
                  runtime:
                    type: object
                    required: [iec104EnvelopeOpen, reason]
                    properties:
                      iec104EnvelopeOpen:
                        type: boolean
                        description: Whether the engine owns the candidate queue at sampling time; used only if enforcement is enabled and the candidate has an IEC 104 envelope.
                      reason: {type: string, description: Explanation of disabled enforcement or the sampled envelope decision}
                      gateAdmit:
                        type: string
                        enum: [refuse, open, pass]
                        description: The scanning gate's admission state sampled at request time and compiled into the preview; omitted when enforcement is disabled.
                      gateAdmitReason: {type: string, description: What the sampled admission means for the candidate's gated connections; omitted when enforcement is disabled}
                  warnings:
                    type: array
                    items: {$ref: '#/components/schemas/RuleWarning'}
                    description: Candidate rules that match nothing or that an ALLOW shadows, in rule ID order; omitted when there are none.
                  icsCoverage:
                    type: array
                    items: {$ref: '#/components/schemas/ICSCoverageRule'}
                    description: Static coverage of the candidate's ICS rules, in rule ID order; omitted when there are none.
                  engineStatus: {$ref: '#/components/schemas/EngineRulesetStatus'}
                  engineStatusError: {type: string}
        '400':
          description: Invalid candidate configuration
        '502':
          description: Engine unavailable or unable to compile candidate; no ruleset returned
        '503':
          description: No engine with ruleset preview support is configured; no ruleset returned
  /dataplane/ruleset/status:
    get:
      summary: Status of the installed ruleset
      tags: [Dataplane]
      description: >-
        Readable by any authenticated user. Reports the engine's installed ruleset without compiling the
        candidate and without the ruleset text, which stays with the admin-only GET /dataplane/ruleset:
        the failed apply and the schedule planner state behind degraded enforcement health.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EngineRulesetStatus'
                - type: object
                  required: [installed]
                  description: ruleset is never present.
                  properties:
                    installed: {type: boolean, description: Whether a ruleset is in force; false before the first successful apply and while enforcement is disabled.}
        '502':
          description: The engine did not report its ruleset status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: No engine is configured
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /security/conduits:
    get:
      summary: Summarize running zone-to-zone policy
      tags: [Security]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {type: object, additionalProperties: {$ref: '#/components/schemas/ConduitResult'}}
  /system/tls/cert:
    post:
      summary: Replace TLS certificate and key files (admin)
      tags: [System]
      description: >-
        Writes a validated PEM certificate and key to the files the HTTPS listener
        serves at the next start (certFile and keyFile of GET /system/tls), under
        /data; does not change saved listener paths. The bound HTTPS listener
        reloads the files it serves at its next TLS handshake after they change.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetTLSCertRequest'}
      responses:
        '200':
          description: >-
            Files written. Status updated means the bound HTTPS listener serves
            these files and presents the new certificate from its next handshake.
            Status stored means it serves other files, or no HTTPS listener is
            bound, and the new certificate is served from the next management
            start; the warnings array and X-Containd-Warnings say so.
          headers:
            X-Containd-Warnings: {$ref: '#/components/headers/Warnings'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
        '409':
          description: >-
            Nothing written. The resolved certificate or key path is outside /data
            (the error names the path and its selecting environment variable,
            config field, or default), or only one of the two is a file the bound
            HTTPS listener serves, which would pair the new file with the served one.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /system/tls/trusted-ca:
    post:
      summary: Replace or clear the stored trusted CA PEM file (admin)
      description: >-
        Validates every PEM block as a CA certificate and atomically replaces the
        bundle under /data. The running trustedCAFile setting selects its path;
        the default is /data/tls/trusted_ca.pem. The stored content and its
        revision are then sent to the engine, whose ICAP-over-TLS and FreshClam
        clients trust the system roots plus this bundle. Every config apply
        sends the bundle again, so a bundle the engine could not apply is
        retried by the next commit.
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetTrustedCARequest'}
      responses:
        '200':
          description: >-
            Bundle stored or cleared. Status updated means the engine applied
            it; status stored means the engine is unavailable or did not apply
            it, and warnings say why.
          headers:
            X-Containd-Warnings: {$ref: '#/components/headers/Warnings'}
          content:
            application/json:
              schema:
                type: object
                required: [status, revision, warnings]
                properties:
                  status: {type: string, enum: [updated, stored]}
                  revision: {type: string, description: 'sha256:<hex> of the stored bundle, or none when cleared'}
                  warnings:
                    type: array
                    items: {type: string}
                    description: Why the engine did not apply the stored bundle; empty when status is updated
        '400':
          description: Invalid JSON, empty or invalid CA bundle, conflicting clear and PEM, or path outside /data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: Config store unavailable; nothing was stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /ids/convert/sigma:
    post:
      summary: Convert Sigma YAML without persisting
      tags: [Ids]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sigmaYAML: {type: string}
              required: [sigmaYAML]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IDSRule'}
  /ids/import:
    post:
      summary: Import rules into candidate bank (admin)
      tags: [Ids]
      description: Imports and deduplicates by rule ID in the candidate bank. Format is detected from file when omitted. Commit to apply.
      responses:
        '400':
          description: 'Invalid import or removed industrial protocol. Rejected imports leave candidate and running banks unchanged; ids rule <id> proto "<name>" is not supported; supported: modbus, dnp3, iec104, cip'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported: {type: integer}
                  skipped: {type: integer}
                  total: {type: integer}
                  format: {type: string}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                format: {type: string, enum: [suricata, snort, yara, sigma]}
              required: [file]
  /ids/export:
    get:
      summary: Export running IDS rules
      tags: [Ids]
      description: Downloads running IDS rules, not candidate rules.
      responses:
        '200':
          description: >-
            Exported rule text (possibly no accepted rules). Every format includes
            JSON comments of the form '# refused: {"rule_id":"...","reason":"..."}'
            for refused rules, using '//' instead of '#' for YARA.
            Refused rules are not emitted as active rules.
          headers:
            X-Containd-IDS-Refused:
              description: Number of rules refused because their predicates cannot be preserved.
              schema: {type: integer, minimum: 0}
          content:
            text/plain:
              schema: {type: string}
            text/yaml:
              schema: {type: string}
      parameters:
      - name: format
        in: query
        required: false
        schema: {type: string, enum: [suricata, snort, yara, sigma], default: suricata}
  /ids/backup:
    get:
      summary: Download running IDS rule bank
      tags: [Ids]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/IDSRule'}}
  /ids/restore:
    post:
      summary: Replace candidate IDS bank (admin)
      tags: [Ids]
      description: Stages the shared candidate; commit to apply.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: array, items: {$ref: '#/components/schemas/IDSRule'}}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  count: {type: integer}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
  /ids/sources:
    get:
      summary: List external rule source metadata
      tags: [Ids]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/IDSRuleSource'}}
  /pcap/list:
    get:
      summary: List captured/uploaded files
      tags: [Pcap]
      responses:
        '200':
