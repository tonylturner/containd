    ScheduleConfig:
      description: >-
        A window opens on each listed day (every day when daysOfWeek is empty) at
        startTime in timezone and closes at endTime, which is exclusive. An end not
        after the start ends on the next day; the window belongs to its start day.
        Blank startTime is 00:00 and blank endTime the end of the day; equal times
        are invalid. A skipped local time is the end of the daylight-saving gap and
        a repeated one its first occurrence.
      properties:
        daysOfWeek: {items: {type: string, enum: [Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday]}, type: array}
        endTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: "06:00"}
        startTime: {type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: "02:00"}
