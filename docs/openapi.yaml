  # ── Firewall ──────────────────────────────────────────────────────
  /firewall/rules:
    get:
      summary: List firewall rules
      tags: [Firewall]
      responses:
        "200":
          description: Array of firewall rules
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/FirewallRule"}, nullable: true}
    post:
      summary: Create firewall rule (admin)
      tags: [Firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirewallRule'}
      responses:
        "200": {description: Rule created, content: {application/json: {schema: {$ref: '#/components/schemas/FirewallRule'}}}, headers: {
              X-Containd-Config: {$ref: '#/components/headers/Staged'}}}
        "400": {description: Invalid rule or resulting configuration; unsupported ICS protocol names are rejected without staging or applying changes, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
      description: Stages the shared candidate; commit to apply.

  /firewall/rules/{id}:
    patch:
      summary: Update a firewall rule (admin)
      description: |
        Merges the body into the rule. Top-level keys deep-merge as JSON.
        The `ics` object is handled on its own: it is decoded strictly
        (unknown or duplicate keys, and null or [] on typeIds, classes, ca
        and ioa, are errors). If it sets a `protocol` different from the
        rule's, it replaces the predicate; otherwise its keys overlay the
        current predicate and the result is decoded strictly again, so keys
        the protocol does not support are rejected. `"ics": null` clears
        the predicate.
      tags: [Firewall]
      parameters:
      - $ref: "#/components/parameters/pathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirewallRulePatch'}
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FirewallRule"}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
        "400":
          description: Invalid patch or resulting configuration
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "404": {description: Rule not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    delete:
      summary: Delete firewall rule (admin)
      tags: [Firewall]
      parameters:
      - $ref: "#/components/parameters/pathId"
      responses:
        '204':
          description: Success
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
      description: Stages the shared candidate; commit to apply.

  # ── Events & Flows ────────────────────────────────────────────────
  /events:
    get:
      summary: List recent ICS/network events
      description: |
        Returns an evidence-aware page, not the globally newest events.
        Each runtime store independently retains its latest 1024 logged
        firewall.rule.hit events with attributes.action equal to DENY or
        RESET, in addition to its general event ring. Only later DENYs evict this
        bank; there is no age expiry. It survives configuration rebuilds,
        but not process restarts.

        A separate IEC104 bank retains 128 incident sessions with up to 32
        evidence rows each: deny/would_drop decisions, verdicts, abort/reset
        and unhealthy outcomes, plus implicated decoded APDU context. Routine
        allowed objects are not pinned. The oldest-created bundle is evicted
        on session overflow; oldest rows are evicted on per-session overflow.
        Retained bank slots are general capacity + 5120 (9216 by default),
        plus the unchanged optional 1024-row spill queue. This is a row bound,
        not a fixed byte allocation; event payload sizes follow their producers.

        With no filters (only limit), returns the legacy bare array: DENYs
        and IEC incident outcomes take slots before ordinary telemetry, then
        the selected page is sorted newest-first by timestamp and ID. An engine
        telemetry error always reserves a slot. IDs and flow rollups are unchanged.

        Passing any filter, since/cursor, or query=1 returns EventPage instead.
        Filters apply before limit, across retained general/incident/DENY rows
        and merged service events. Query pages are strictly newest-first by
        timestamp then ID, without evidence priority. AND combines filters;
        kind accepts comma-separated prefixes (OR). Empty filters match all.
        since is inclusive RFC3339; cursor is an opaque exclusive upper bound
        on (timestamp, ID). Send nextCursor with the same filters for older rows.
        Pagination searches retained memory only, not spill files or durable
        history. New inserts and eviction can change later pages; this is not
        a snapshot. An absent nextCursor means no more retained matches, not
        proof of complete history. historyTruncated is conservative and cannot
        detect losses from an earlier process lifetime. Service history has no
        overflow metadata, so merged service queries warn conservatively.
        Malformed bounds or limits return 400. An unavailable engine is reported
        in engineError even when filters match no rows.
      tags: [Telemetry]
      parameters:
      - name: limit
        in: query
        description: Hard maximum page size; filter before limit in query mode, evidence priority in legacy mode.
        schema: {type: integer, default: 500, minimum: 1, maximum: 5000}
      - name: query
        in: query
        description: Request EventPage even without filters.
        schema: {type: string, enum: ["1"]}
      - name: id
        in: query
        description: Exact event ID; event-detail lookup uses this before limiting.
        schema: {type: integer, format: uint64, minimum: 1}
      - name: session
        in: query
        description: Exact attributes.session_id (IEC incarnation).
        schema: {type: string}
      - name: flow
        in: query
        description: Exact flowId or session_id, including session-oriented flow deep links.
        schema: {type: string}
      - name: apdu
        in: query
        description: Exact apdu_id, trigger_apdu_id, or member of apdu_ids.
        schema: {type: string}
      - name: kind
        in: query
        description: Case-sensitive kind prefixes, comma-separated OR (for example ics.decision,ics.verdict).
        schema: {type: string}
      - name: protocol
        in: query
        description: Case-insensitive proto equality.
        schema: {type: string}
      - name: ruleId
        in: query
        description: Exact case-sensitive rule identifier.
        schema: {type: string}
      - name: mode
        in: query
        description: Effective decision mode.
        schema: {type: string, enum: [monitor, enforce]}
      - name: decision
        in: query
        description: Case-insensitive attributes.decision equality (allow, deny, would_allow, would_drop).
        schema: {type: string}
      - name: verdict
        in: query
        description: Case-insensitive attributes.outcome or attributes.action equality (for example drop_failed or DENY).
        schema: {type: string}
      - name: since
        in: query
        description: Inclusive timestamp lower bound, RFC3339 with optional fractional seconds.
        schema: {type: string, format: date-time}
      - name: cursor
        in: query
        description: Exclusive upper bound from nextCursor; keep all other filters unchanged.
        schema: {type: string}
      - name: category
        in: query
        description: Server-side Events page category; dpi excludes firewall and service kinds.
        schema: {type: string, enum: [all, service, proxy, dpi, firewall, iec104]}
      - name: detections
        in: query
        description: With 1, match only service.av.detected and service.av.block_flow.
        schema: {type: string, enum: ["1"]}
      responses:
        "200":
          description: Legacy bare array for only-limit callers; EventPage when query or filter parameters are present.
          content:
            application/json:
              schema:
                oneOf:
                - {type: array, items: {$ref: "#/components/schemas/Event"}}
                - {$ref: "#/components/schemas/EventPage"}
        "400":
          description: Invalid limit, timestamp, cursor, or category.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        "502":
          description: Engine implementation does not support filtered queries.

          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /flows:
    get:
      summary: List aggregated flow summaries
      tags: [Telemetry]
      parameters:
      - name: limit
        in: query
        schema: {type: integer, default: 200, maximum: 5000}
      responses:
        "503":
          description: Engine capability missing or unavailable; not an empty or stopped state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "200":
          description: Array of flow summaries
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/FlowSummary"}}

  # ── Audit ─────────────────────────────────────────────────────────
  /audit:
    get:
      summary: List audit log records
      tags: [Audit]
      parameters:
      - name: limit
        in: query
        schema: {type: integer, default: 100, maximum: 1000}
      - name: offset
        in: query
        schema: {type: integer, default: 0}
      responses:
        "200":
          description: Array of audit records
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/AuditRecord"}}
      description: Available when an audit store is configured.

  # ── PCAP Analysis ────────────────────────────────────────────────
  /pcap/config:
    get:
      summary: Get PCAP capture settings
      tags: [PCAP]
      responses:
        "200":
          description: Capture settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PcapConfig"}
    post:
      summary: Stage PCAP settings (admin)
      tags: [PCAP]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PcapConfig'}
      responses:
        "200":
          description: Candidate capture settings; commit to persist running settings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PcapConfig'}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
        "400": {description: Invalid capture settings, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
      description: Stages the shared candidate; commit to apply.

  /pcap/start:
    post:
      summary: Start PCAP capture (admin)
      tags: [PCAP]
      requestBody:
        required: false
        description: >
          An omitted or empty body starts the committed (running) PCAP
          configuration. A nonempty body is used for this capture only and is
          never saved. Start and stop never write configuration; save PCAP
          settings through the staged PCAP configuration endpoint and commit.
          If no engine is connected, the response is "pcap start queued".
          Omitted fields use their normal defaults rather than saved values.
          The complete configuration must select at least one interface or
          zone; an empty selection is rejected. Logical interfaces resolve to
          their Device when set, otherwise their Name, and the kernel device
          must exist. Explicit interfaces that resolve to missing devices are
          rejected. Zones include only members with existing kernel devices;
          a zone with none is rejected with its name and unbound members.
          Start responses and status list resolved kernel devices only.
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PcapConfig"}
      responses:
        "200":
          description: Capture started with resolved kernel devices
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/PcapStatus'}
                - {$ref: '#/components/schemas/StatusResponse'}
        "400": {description: 'Invalid or unresolved interface, zone, or filter', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /pcap/stop:
    post:
      summary: Stop PCAP capture (admin)
      tags: [PCAP]
      responses:
        "200":
          description: Capture status after stopping
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: '#/components/schemas/PcapStatus'}
                - {$ref: '#/components/schemas/StatusResponse'}

  /pcap/status:
    get:
      summary: Get PCAP capture status
      tags: [PCAP]
      responses:
        "200":
          description: Current capture state and resolved devices
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PcapStatus"}

  /pcap/analyze:
    post:
      summary: Upload a PCAP file for DPI analysis and policy generation (admin)
      tags: [PCAP]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PCAP or PCAPng file
      responses:
        "200":
          description: Analysis results with generated rules
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PolicyAnalysis"}
        "400": {description: Invalid or non-PCAP file, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
      description: Offline analysis returns suggested rules only; does not stage or apply policy, populate live inventory or update live
        learn profiles.

  /pcap/analyze/{name}:
    post:
      summary: Analyze a previously uploaded PCAP by name (admin)
      tags: [PCAP]
      parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
        description: Name of an uploaded PCAP file
      responses:
        "200":
          description: Analysis results with generated rules
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PolicyAnalysis"}
        "404": {description: PCAP not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
      description: Offline analysis returns suggested rules only; does not stage or apply policy, populate live inventory or update live
        learn profiles.

  # ── ICS Rule Templates ──────────────────────────────────────────
  /templates/ics:
    get:
      summary: List available ICS protocol security templates
      tags: [Templates]
      responses:
        "200":
          description: Array of available ICS templates
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ICSTemplateInfo"}

  /templates/ics/apply:
    post:
      summary: Apply an ICS template to generate firewall rules (admin)
      tags: [Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApplyICSTemplateRequest"}
      responses:
        "200":
          description: Previewed rules or rules staged in candidate configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: {type: string}
                  preview: {type: boolean}
                  applied: {type: boolean}
                  created: {type: integer}
                  updated: {type: integer}
                  ruleCount: {type: integer}
                  rules: {type: array, items: {$ref: '#/components/schemas/FirewallRule'}}
                  mode: {type: string}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
        "400": {description: Unknown template or missing params, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
      description: Preview returns generated rules without staging. Otherwise upserts candidate rules by ID; commit to apply.

  # ── Rule Impact Preview ─────────────────────────────────────────
  /firewall/rules/preview:
    post:
      summary: Dry-run a proposed rule against recent traffic (admin)
      description: >
        Matches the rule against recent events. For an iec104 rule, each
        decoded IEC104 object event (request, response, apci, malformed,
        unsupported) is matched in the session orientation (client to
        server port 2404); decision events do not count. readOnly iec104
        rules do not match in a preview yet.
      tags: [Firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirewallRulePatch'}
      responses:
        "200":
          description: Preview results showing how many recent events match
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RulePreviewResponse"}
        "400": {description: Invalid rule payload, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "502": {description: The engine failed to evaluate the preview, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "503": {description: No engine rule preview is available, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  # ── Learn Mode ──────────────────────────────────────────────────
  /learn/profiles:
    get:
      summary: List learned ICS traffic profiles
      tags: [Learn]
      responses:
        "503":
          description: Engine capability missing or unavailable; not an empty or stopped state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "200":
          description: Array of learned traffic profiles
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/LearnedProfile"}

  /learn/generate:
    post:
      summary: Generate suggested firewall rules (admin)
      tags: [Learn]
      responses:
        "503":
          description: Engine capability missing or unavailable; not an empty or stopped state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "200":
          description: Generated allowlist rules
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FirewallRule'}}

  /learn/apply:
    post:
      summary: Stage learned rules (admin)
      tags: [Learn]
      responses:
        "503":
          description: Engine capability missing or unavailable; no rules staged.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "200": {description: 'Rules staged, or no rules to apply (no staging header for the no-op).', content: {application/json: {schema: {
                  type: object, properties: {status: {type: string}, count: {type: integer}, rules: {type: array, items: {$ref: '#/components/schemas/FirewallRule'}}}}}},
          headers: {X-Containd-Config: {$ref: '#/components/headers/Staged'}}}
        "400": {description: Generated rules or candidate configuration failed validation, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
      description: Stages the shared candidate; commit to apply.

  /learn:
    delete:
      summary: Clear all learned traffic profiles (admin)
      tags: [Learn]
      responses:
        "503":
          description: Engine capability missing or unavailable; not an empty or stopped state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "200": {description: Learned data cleared, content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}}}

  # ── ICS Inventory ──────────────────────────────────────────────
  /inventory:
    get:
      summary: List discovered ICS assets
      tags: [Inventory]
      responses:
        "200":
          description: Array of discovered ICS assets
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/InventoryDiscoveredAsset'}}
        '503':
          description: Engine inventory unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
    delete:
      summary: Clear legacy and IEC 104 inventories and overflow counters (admin)
      tags: [Inventory]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
        '503':
          description: Engine inventory unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /inventory/iec104:
    get:
      summary: Read passive IEC 104 station pairs, CAs, points and command counts
      description: Observational only; never generates learned rules. Entries use observation-recency LRU and 24-hour idle expiry. Counts cover retained history, not lifetime traffic. Fed from decoded traffic; acceptance is credited only in inline enforce mode.
      tags: [Inventory]
      responses:
        '200':
          description: IEC 104 inventory snapshot, fixed bounds and cumulative overflow counters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IEC104Inventory'}
        '503':
          description: Engine inventory unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  # ── Signatures ─────────────────────────────────────────────────
  /signatures:
    get:
      summary: List loaded IDS signatures
      tags: [Signatures]
      responses:
        "503":
          description: Engine capability missing or unavailable; not an empty or stopped state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "200":
          description: Array of signatures
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/SignaturesSignature'}}
    post:
      summary: Add live custom signature (admin)
      description: The signature is active until the engine restarts. Signature IDs are unique.
      tags: [Signatures]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignaturesSignature'}
      responses:
        "503":
          description: Engine capability missing or unavailable; not an empty or stopped state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "200": {description: Signature added, content: {application/json: {schema: {$ref: '#/components/schemas/SignaturesSignature'}}}}
        "400": {description: 'Invalid signature. Unsupported industrial names return signature <id> protocol "<name>" is not supported; supported: modbus, dnp3, iec104, cip', content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "409": {description: A signature with this ID is already loaded, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /signatures/{id}:
    delete:
      summary: Delete live signature (admin)
      tags: [Signatures]
      parameters:
      - $ref: "#/components/parameters/pathId"
      responses:
        "503":
