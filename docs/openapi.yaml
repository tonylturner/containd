  /config/commit_confirmed:
    post:
      summary: Commit with automatic rollback unless confirmed (admin)
      tags: [Config]
      description: >
        Same strict apply/recovery semantics as commit, including nft failures.
        Success starts a rollback timer (60 seconds by default); failure restores
        the pre-request running document, IDS bank, candidate, previous snapshots
        and pending deadline, then attempts reapply. Failed reapply leaves runtime
        synchronization uncertain and is exposed in health.
        Confirm before expiry to retain this running document. Expiry restores
        stored state and requests replay; a replay error is retried and exposed
        in health, not converted into a successful runtime apply. A plain commit
        cancels the timer and replaces its rollback baseline.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl_seconds: {type: integer, format: int64, default: 60, description: Positive seconds; omitted or nonpositive uses 60; duration overflow is rejected}
      responses:
        '200':
          description: Applied and awaiting confirmation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Committed'}
            X-Containd-Warnings: {$ref: '#/components/headers/Warnings'}
        '400':
          description: Invalid request, overflowing TTL, preflight or candidate validation failure; no promotion or recovery fields
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Admin role required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        "500":
          description: Runtime apply failed; inspect recovery outcomes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigApplyError'}
  /config/confirm:
    post:
      summary: Confirm pending confirmed commit (admin)
      description: >
        Only cancels the pending rollback deadline; does not reapply runtime.
        The committed header acknowledges confirmation, not a new runtime apply.
      tags: [Config]
      responses:
        '200':
          description: Confirmation recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Committed'}
        '400':
          description: Confirmation failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Admin role required
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
  /simulation:
    get:
      summary: Inspect simulation
      tags: [Simulation]
      responses:
        "503":
          description: Engine capability missing or unavailable; not an empty or stopped state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationStatus'}
    post:
      summary: Start or stop synthetic traffic (admin)
      tags: [Simulation]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action: {type: string, enum: [start, stop]}
              required: [action]
      responses:
        "503":
          description: Engine capability missing or unavailable; not an empty or stopped state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationStatus'}
  /system/stats:
    get:
      summary: Inspect system stats
      tags: [System]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemStatsResponse'}
  /system/inspection:
    get:
      summary: Inspect system inspection
      tags: [System]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InspectionResponse'}
  /system/tls:
    get:
      summary: Inspect system tls
      tags: [System]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TlsInfoResponse'}
  /firewall/shadow-counters:
    get:
      summary: Applied-policy monitor message counters
      description: >-
        View-role access. Independent of nftables. Every effective-monitor ICS rule of the installed
        snapshot is listed, including zero counts. One match per rule per decoded message, not per
        object. Memory counters reset on successful policy install or restart; failed applies retain
        the installed snapshot and counts. Before first apply or on engine unavailability returns available false, never zeros.
        NFQUEUE observations repeat into the ordinary firewall; queues have no bypass when the engine is down.
      tags: [Firewall]
      responses:
        '200':
          description: Counters or an explicit unavailability reason
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  required: [available, snapshotVersion, since, unit, rules]
                  properties:
                    available: {type: boolean, enum: [true]}
                    snapshotVersion: {type: string}
                    since: {type: string, format: date-time}
                    unit: {type: string, enum: [messages]}
                    rules:
                      type: array
                      items:
                        type: object
                        required: [ruleId, shadowMatches, wouldAllow, wouldDeny]
                        properties:
                          ruleId: {type: string}
                          shadowMatches: {type: integer, minimum: 0}
                          wouldAllow: {type: integer, minimum: 0}
                          wouldDeny: {type: integer, minimum: 0}
                - type: object
                  required: [available, reason]
                  properties:
                    available: {type: boolean, enum: [false]}
                    reason: {type: string}
  /firewall/counters:
    get:
      summary: Per-rule counters of the applied ruleset
      description: >-
        Kernel packet and byte counters of every firewall rule, plus the packets each
        RATE_LIMIT rule dropped over its limit. Logging need not be on. Each apply replaces
        the ruleset and restarts the counters at zero; since says when.
      tags: [Firewall]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RuleCounters'}
        '502':
          description: >-
            The engine could not report counters: enforcement is off, no ruleset is applied,
            the last apply failed, or nftables could not be read. The body carries the reason.
        '503':
          description: Engine unavailable
  /conntrack:
    get:
      summary: List kernel connections (IPv4 and IPv6)
      tags: [Conntrack]
      responses:
        '200':
          description: Verified snapshot; an empty array means the kernel table was empty
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ConntrackEntry'}}
        '503':
          description: Conntrack backend unavailable
        '502':
          description: Engine dump unavailable or incomplete; error body includes the reason
      parameters:
      - name: limit
        in: query
        required: false
        schema: {type: integer, default: 200, minimum: 1, maximum: 5000}
  /templates:
    get:
      summary: List templates
      tags: [Templates]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/PolicyTemplate'}}
  /conntrack/kill:
    post:
      summary: Revoke a connection or client-service (admin)
      tags: [Conntrack]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConntrackKillRequest'}
      responses:
        '200':
          description: Per-step outcome, including partial failures. Revocation is installed before deletion. No injected reset or confirmed closure is claimed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConntrackKillResult'}
        '400':
          description: Invalid tuple, scope or duration
        '502':
          description: Kernel dump unavailable or selected connection no longer present; includes reason
        '501':
          description: Engine does not support connection revocation
  /inventory/{ip}:
    get:
      summary: List discovered observations for an IP
      tags: [Inventory]
      responses:
        '200':
          description: Success
