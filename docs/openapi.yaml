  /templates/apply:
    post:
      summary: Stage policy template rules (admin)
      tags: [Templates]
      description: Stages the shared candidate; commit to apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                mode: {type: string, enum: ['', monitor, enforce]}
              required: [name]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: {type: string}
                  ruleCount: {type: integer}
                  mode: {type: string}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
  /firewall/ics-rules:
    get:
      summary: List candidate rules with ICS predicates
      tags: [Firewall]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/FirewallRule'}}
    post:
      summary: Create ICS rule (admin)
      tags: [Firewall]
      description: Stages the shared candidate; commit to apply.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FirewallRule'}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirewallRule'}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
  /firewall/ics-rules/{id}:
    patch:
      summary: Replace existing ICS rule (admin)
      tags: [Firewall]
      description: Replacement, not a merge; omitted ID is retained. Target must be an ICS rule. Stages the shared candidate; commit to
        apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/FirewallRulePatch'
              required:
              - action
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FirewallRule'}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
  /identities:
    get:
      summary: List identity bindings
      tags: [Identities]
      description: Reads firewall.identityBindings of the candidate configuration.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [mappings]
                properties:
                  mappings: {type: array, items: {$ref: '#/components/schemas/IdentityMapping'}}
    post:
      summary: Stage an identity binding (admin)
      tags: [Identities]
      description: >-
        Binds an address to identities in the candidate, replacing its existing
        binding. Stages the shared candidate; commit to apply.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityMapping'}
      responses:
        '200':
          description: Staged binding, with the canonical address
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityMapping'}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
        '400': {description: Invalid address or resulting configuration, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
  /identities/{ip}:
    delete:
      summary: Stage removal of an identity binding (admin)
      tags: [Identities]
      description: Removes the address's binding from the candidate. Stages the shared candidate; commit to apply.
      responses:
        '200':
          description: Staged removal
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: {type: string}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
        '400': {description: Invalid address, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        '404': {description: No binding for the address, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
      parameters:
      - name: ip
        in: path
        required: true
        schema: {type: string}
  /cli/execute:
    post:
      summary: Execute a CLI command as the authenticated role
      tags: [Cli]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                line: {type: string}
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  output: {type: string}
                  error: {type: string}
  /cli/commands:
    get:
      summary: List commands permitted for current role
      tags: [Cli]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {type: array, items: {type: string}}
  /cli/complete:
    get:
      summary: Complete a CLI command line
      tags: [Cli]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {type: array, items: {type: string}}
      parameters:
      - name: line
        in: query
        required: false
        schema: {type: string}
  /cli/ws:
    get:
      summary: Upgrade to interactive CLI WebSocket
      tags: [Cli]
      description: 'Requires same-host Origin and authentication. Client sends a command string or {line: string}; server sends JSON {output:
        string, error?: string}.'
      responses:
        '101':
          description: Success
  /services/vpn/openvpn/profile:
    post:
      summary: Upload foreground OpenVPN profile and stage its path (admin)
      tags: [Services]
      description: Stages the shared candidate; commit to apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
                ovpn: {type: string}
              required: [ovpn]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  configPath: {type: string}
                  vpn: {$ref: '#/components/schemas/VPNConfig'}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
  /services/vpn/openvpn/clients:
    get:
      summary: List issued OpenVPN clients (admin)
      tags: [Services]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  clients: {type: array, items: {type: string}}
    post:
      summary: Issue OpenVPN client credentials (admin)
      tags: [Services]
      description: Uses running managed-server settings; creates credential artifacts immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: {type: string}
              required: [name]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string}
  /services/vpn/openvpn/clients/{name}:
    get:
      summary: Download OpenVPN client profile (admin)
      tags: [Services]
      responses:
        '200':
          description: Client profile with inline credentials
          content:
            application/x-openvpn-profile:
              schema: {type: string}
      parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
  /services/av/update:
    post:
      summary: Start AV definition update (admin)
      tags: [Services]
      description: >-
        Queues an immediate FreshClam run on the engine's update schedule.
        The response means the run was accepted; the result appears in the
        av entry of /services/status.
      responses:
        '202':
          description: Update queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
        '409':
          description: AV is not enabled in clamav mode, automatic updates are disabled, or an update is already running
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '503':
          description: Engine unavailable
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
  /services/av/defs:
    get:
      summary: List live custom AV definitions
      tags: [Services]
      description: Custom signature databases stored on the engine; path is engine-local.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  files: {type: array, items: {type: string}}
                  path: {type: string}
                  definitions:
                    type: array
                    items:
                      type: object
                      properties:
                        name: {type: string}
                        size: {type: integer}
                        modified: {type: string, format: date-time}
                        active: {type: boolean, description: A running clamd is loading the definition}
        '503':
          description: Engine unavailable
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    post:
      summary: Upload live AV definition (admin)
      tags: [Services]
      description: >-
        Streams a ClamAV signature database (for example .ndb, .hdb, .ldb or
        .yar, at most 64 MiB) to the engine, which validates it with clamscan,
        activates it and reloads clamd.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  file: {type: string}
                  active: {type: boolean, description: clamd is loading the definition}
        '400':
          description: Invalid name, type, size or signature content
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '503':
          description: Engine unavailable
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
              required: [file]
    delete:
      summary: Delete live AV definition (admin)
      tags: [Services]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  file: {type: string}
        '400':
          description: Invalid or unknown definition
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '503':
          description: Engine unavailable
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
      parameters:
      - name: file
        in: query
        required: true
        schema: {type: string}
  /services/status:
    get:
      summary: Inspect live services
      tags: [Services]
      description: >-
        Management service status keyed by service. The av entry is the
        engine's live antivirus status (ready, db_version, counters) with the
        scanning gate under gate; when the engine cannot be reached it is
        {"available": false, "error": ...}.
        syslog.audit reports audit-record forwarding: enabled, sent_total,
        failed_total, last_error, last_flush, backlog, and forwarders, a list
        of {forwarder, last_id, backlog, last_error, last_sent}.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  av: {$ref: '#/components/schemas/AVStatus'}
