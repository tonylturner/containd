  /pcap/replay:
    post:
      summary: Replay a PCAP file on an interface (admin)
      tags: [Pcap]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PcapReplayRequest'}
      responses:
        '202':
