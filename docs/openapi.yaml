      tags: [Services]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Updated }

  /services/dns:
    get:
      summary: Get DNS configuration
      tags: [Services]
      responses:
        "200": { description: DNS config, content: { application/json: { schema: { type: object } } } }
    post:
      summary: Set DNS configuration (admin)
      tags: [Services]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Updated }

  /services/ntp:
    get:
      summary: Get NTP configuration
      tags: [Services]
      responses:
        "200": { description: NTP config, content: { application/json: { schema: { type: object } } } }
    post:
      summary: Set NTP configuration (admin)
      tags: [Services]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Updated }

  /services/dhcp:
    get:
      summary: Get DHCP configuration
      tags: [Services]
      responses:
        "200": { description: DHCP config, content: { application/json: { schema: { type: object } } } }
    post:
      summary: Set DHCP configuration (admin)
      tags: [Services]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Updated }

  /services/vpn:
    get:
      summary: Get VPN configuration
      tags: [Services]
      responses:
        "200": { description: VPN config, content: { application/json: { schema: { type: object } } } }
    post:
      summary: Set VPN configuration (admin)
      tags: [Services]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200": { description: Updated }

  # ── Firewall ──────────────────────────────────────────────────────
  /firewall/rules:
    get:
      summary: List firewall rules
      tags: [Firewall]
      responses:
        "200":
          description: Array of firewall rules
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FirewallRule" } }
    post:
      summary: Create a firewall rule (admin)
      tags: [Firewall]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/FirewallRule" } } } }
      responses:
        "200": { description: Rule created }
        "400": { description: Invalid rule or resulting configuration }

  /firewall/rules/{id}:
    patch:
      summary: Update a firewall rule (admin)
      description: |
        Merges the body into the rule. Top-level keys deep-merge as JSON.
        The `ics` object is handled on its own: it is decoded strictly
        (unknown or duplicate keys, and null or [] on typeIds, classes, ca
        and ioa, are errors). If it sets a `protocol` different from the
        rule's, it replaces the predicate; otherwise its keys overlay the
        current predicate and the result is decoded strictly again, so keys
        the protocol does not support are rejected. `"ics": null` clears
        the predicate.
      tags: [Firewall]
      parameters:
        - $ref: "#/components/parameters/pathId"
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirewallRule" }
        "400":
          description: Invalid patch or resulting configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { description: Rule not found }
    delete:
      summary: Delete a firewall rule (admin)
      tags: [Firewall]
      parameters:
        - $ref: "#/components/parameters/pathId"
      responses:
        "200": { description: Rule deleted }

  # ── Events & Flows ────────────────────────────────────────────────
  /events:
    get:
      summary: List recent ICS/network events
      description: |
        Returns an evidence-aware page, not the globally newest events.
        Each runtime store independently retains its latest 1024 logged
        firewall.rule.hit events with attributes.action equal to DENY,
        in addition to its general event ring. Only later DENYs evict this
        bank; there is no age expiry. It survives configuration rebuilds,
        but not process restarts.

        Select DENYs newest-first before filling remaining slots with the
        newest other engine and service events. Deduplicate by event ID,
        then return the selected page newest-first (timestamp, then ID).
        An engine telemetry-error event always reserves a slot, including
        when limit is 1. The limit is a hard maximum, so small pages may
        contain only DENYs or the telemetry error. Retained DENYs remain
        available to event detail lookup; flow rollups use only the general
        ring and do not gain historical groups from the DENY bank.
      tags: [Telemetry]
      parameters:
        - name: limit
          in: query
          description: Hard maximum page size; retained DENYs take precedence over newer ordinary events.
          schema: { type: integer, default: 500, maximum: 5000 }
      responses:
        "200":
          description: Array of events
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Event" } }

  /flows:
    get:
      summary: List aggregated flow summaries
      tags: [Telemetry]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 200, maximum: 5000 }
      responses:
        "200":
          description: Array of flow summaries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FlowSummary" } }

  # ── Audit ─────────────────────────────────────────────────────────
  /audit:
    get:
      summary: List audit log records
      tags: [Audit]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 1000 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Array of audit records
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditRecord" } }

  # ── PCAP Analysis ────────────────────────────────────────────────
  /pcap/config:
    get:
      summary: Get PCAP capture settings
      tags: [PCAP]
      responses:
        "200":
          description: Capture settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PcapConfig" }
    post:
      summary: Save PCAP capture settings (admin)
      tags: [PCAP]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PcapConfig" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PcapConfig" }
        "400": { description: Invalid capture settings }

  /pcap/start:
    post:
      summary: Start PCAP capture (admin)
      tags: [PCAP]
      requestBody:
        required: false
        description: >
          An omitted or empty body starts the saved PCAP configuration. A
          nonempty body replaces the saved configuration for this start;
          omitted fields use their normal defaults rather than saved values.
          The complete configuration must select at least one interface or
          zone; an empty selection is rejected.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PcapConfig" }
      responses:
        "200":
          description: Capture started with resolved kernel devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PcapStatus" }
        "400": { description: Invalid or unresolved interface, zone, or filter }

  /pcap/stop:
    post:
      summary: Stop PCAP capture (admin)
      tags: [PCAP]
      responses:
        "200":
          description: Capture status after stopping
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PcapStatus" }

  /pcap/status:
    get:
      summary: Get PCAP capture status
      tags: [PCAP]
      responses:
        "200":
          description: Current capture state and resolved devices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PcapStatus" }

  /pcap/analyze:
    post:
      summary: Upload a PCAP file for DPI analysis and policy generation
      tags: [PCAP]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PCAP or PCAPng file
      responses:
        "200":
          description: Analysis results with generated rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyAnalysis" }
        "400": { description: Invalid or non-PCAP file }

  /pcap/analyze/{name}:
    post:
      summary: Analyze a previously uploaded PCAP by name
      tags: [PCAP]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: Name of an uploaded PCAP file
      responses:
        "200":
          description: Analysis results with generated rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyAnalysis" }
        "404": { description: PCAP not found }

  # ── ICS Rule Templates ──────────────────────────────────────────
  /templates/ics:
    get:
      summary: List available ICS protocol security templates
      tags: [Templates]
      responses:
        "200":
          description: Array of available ICS templates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ICSTemplateInfo" }

  /templates/ics/apply:
    post:
      summary: Apply an ICS template to generate firewall rules
      tags: [Templates]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyICSTemplateRequest" }
      responses:
        "200":
          description: Previewed or applied rules from the template
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: { type: string }
                  preview: { type: boolean }
                  applied: { type: boolean }
                  created: { type: integer }
                  updated: { type: integer }
                  ruleCount: { type: integer }
                  rules: { type: array, items: { type: object } }
        "400": { description: Unknown template or missing params }

  # ── Rule Impact Preview ─────────────────────────────────────────
  /firewall/rules/preview:
    post:
      summary: Dry-run a proposed rule against recent traffic
      description: >
        Matches the rule against recent events. For an iec104 rule, each
        decoded IEC104 object event (request, response, apci, malformed,
        unsupported) is matched in the session orientation (client to
        server port 2404); decision events do not count. readOnly iec104
        rules do not match in a preview yet.
      tags: [Firewall]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A firewall rule definition (same schema as rule creation)
      responses:
        "200":
          description: Preview results showing how many recent events match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RulePreviewResponse" }
        "400": { description: Invalid rule payload }

