                  leases: {type: array, items: {$ref: '#/components/schemas/DHCPLease'}}
  /services/vpn/wireguard/status:
    get:
      summary: Inspect live WireGuard state
      tags: [Services]
      responses:
        '200':
          description: Success
          content:
            application/json:
