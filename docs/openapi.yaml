              schema: {$ref: '#/components/schemas/StatusResponse'}
        '400':
          description: Invalid JSON, missing current or new password, or a new password that fails the password rules or matches the current one
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Authentication failed or the current password is invalid
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Lab mode (`CONTAIND_LAB_MODE`) refuses every password change, MFA setup is required, or cookie authentication failed the same-origin check.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: The current user was not found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '413':
          description: Request body exceeds the size limit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: Sensitive write rate limit exceeded, or too many failed current-password checks for this account (outside lab mode)
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503':
          description: User store or authentication backend unavailable, or authentication is not configured
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
