    TlsInfoResponse:
      type: object
      description: >-
        The listen addresses and enabled flags are those management binds when it
        starts with the saved configuration: CONTAIND_MGMT_ADDR and
        CONTAIND_MGMT_HTTPS_ADDR take precedence over the saved addresses, then
        the defaults :8080 and :8443 apply. A saved listener change binds at the
        next start. boundHttpListenAddr and boundHttpsListenAddr are the
        listeners management has bound now, at their sockets' addresses (a
        wildcard listen is [::]:port). httpListenChanges and
        httpsListenChanges report whether the next start binds another
        listener than the bound one; every wildcard spelling of the same port
        is the same listener. certFile and keyFile, and the
        certificate fields, are the files the HTTPS listener serves at the next
        start: CONTAIND_TLS_CERT_FILE and CONTAIND_TLS_KEY_FILE, then the saved
        paths, then the defaults. servedCertFile and servedKeyFile, and the
        servedCert fields, are the files and certificate the bound HTTPS
        listener serves now, which a listener fallback to the defaults or a
        path saved after boot makes differ. All file paths are cleaned, so
        equal strings name the same file.
      properties:
        httpListenAddr: {type: string}
        httpsListenAddr: {type: string}
        httpEnabled: {type: boolean}
        httpsEnabled: {type: boolean}
        boundHttpListenAddr: {type: string, description: 'Address of the bound HTTP listener; absent when none is bound'}
        boundHttpsListenAddr: {type: string, description: 'Address of the bound HTTPS listener; absent when none is bound'}
        httpListenChanges: {type: boolean, description: 'True when the next start binds another HTTP listener than the bound one, or binds one where none is bound, or none where one is'}
        httpsListenChanges: {type: boolean, description: 'True when the next start binds another HTTPS listener than the bound one, or binds one where none is bound, or none where one is'}
        certFile: {type: string}
        keyFile: {type: string}
        certSubject: {type: string}
        certIssuer: {type: string}
        certNotAfter: {type: string}
        certDnsNames: {type: array, items: {type: string}, description: 'DNS subject alternative names of the certificate the HTTPS listener serves at the next start'}
        certIps: {type: array, items: {type: string}, description: 'IP address subject alternative names of the certificate the HTTPS listener serves at the next start'}
        servedCertFile: {type: string, description: 'Certificate file of the bound HTTPS listener; absent when no HTTPS listener is bound'}
        servedKeyFile: {type: string, description: 'Key file of the bound HTTPS listener; absent when no HTTPS listener is bound'}
        servedCertSubject: {type: string, description: 'Subject of the certificate the bound HTTPS listener serves; absent when none is bound or its file holds no certificate'}
        servedCertNotAfter: {type: string, description: 'Expiry of the certificate the bound HTTPS listener serves; absent when none is bound or its file holds no certificate'}
        servedCertDnsNames: {type: array, items: {type: string}, description: 'DNS subject alternative names of the certificate the bound HTTPS listener serves; absent when none is bound or it has none'}
        servedCertIps: {type: array, items: {type: string}, description: 'IP address subject alternative names of the certificate the bound HTTPS listener serves; absent when none is bound or it has none'}
    ConfigBackupInfo:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        createdAt: {type: string, format: date-time}
        redacted: {type: boolean}
        size: {type: integer}
        idsRuleCount: {type: integer}
    ConfigBackupRequest:
      type: object
      properties:
        name: {type: string}
        redacted: {type: boolean}
    SyslogPatch:
      type: object
      properties:
        action: {type: string, description: add appends a forwarder; del removes matching address/port; other values do not change
            forwarders.}
        format: {type: string}
        forwarder: {$ref: '#/components/schemas/SyslogForwarder'}
        batchSize: {type: integer}
        flushEvery: {type: integer}
    BlockHostRequest:
      type: object
      properties:
        ip: {type: string, format: ipv4}
        ttlSeconds: {type: integer, minimum: 0}
      required: [ip]
    BlockFlowRequest:
      type: object
      properties:
        srcIp: {type: string, format: ipv4}
        dstIp: {type: string, format: ipv4}
        proto: {type: string}
        dstPort: {type: string}
        ttlSeconds: {type: integer, minimum: 0}
      required: [srcIp, dstIp, proto, dstPort]
    ConduitResult:
      type: object
      properties:
        state: {type: string}
        ids: {type: string}
        proto: {type: array, items: {$ref: '#/components/schemas/ProtoEntry'}}
        traffic: {type: number}
        rules: {type: array, items: {type: string}}
        gaps: {type: array, items: {type: string}}
        mitre: {type: array, items: {type: string}}
        defaultDeny: {type: boolean}
        tlsEnforced: {type: boolean}
        protoWhitelist: {type: boolean}
        mfaRequired: {type: boolean}
        auditLogged: {type: boolean}
        avEnabled: {type: boolean}
    ProtoEntry:
      type: object
      properties:
        n: {type: string}
        t: {type: string}
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword: {type: string, format: password}
        newPassword: {type: string, format: password}
      required: [currentPassword, newPassword]
    SetPasswordRequest:
      type: object
      properties:
        password: {type: string, format: password}
      required: [password]
    UpdateMeRequest:
      type: object
      properties:
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string}
      description: Updates firstName, lastName and email; omitted fields are cleared.
    SetTLSCertRequest:
      type: object
      properties:
        certPEM: {type: string}
        keyPEM: {type: string}
      required: [certPEM, keyPEM]
    SetTrustedCARequest:
      type: object
      description: >-
        Replace the stored bundle with nonblank PEM containing only X.509 CA
        certificates, or clear it with clear=true and no nonblank PEM.
        Empty PEM alone is invalid. Storage does not configure outbound TLS clients.
      properties:
        pem: {type: string}
        clear: {type: boolean, default: false}
      anyOf:
        - required: [pem]
        - required: [clear]
          properties:
            clear: {enum: [true]}
    StatusResponse:
      type: object
      properties:
        status: {type: string}
      required: [status]
    ReconcileRequest:
      type: object
      properties:
        confirm: {type: string, enum: [REPLACE]}
      required: [confirm]
    InterfaceAssignRequest:
      type: object
      properties:
        mode: {type: string, enum: [auto, explicit]}
        mappings: {type: object, additionalProperties: {type: string}}
      description: Stages device bindings. Mappings imply explicit mode when mode is omitted; none or - unbinds a device.
    IdentityMapping:
      type: object
      description: >-
        One firewall.identityBindings entry: a unicast IPv4 or IPv6 address (no zone;
        responses use its canonical form, IPv4 for an IPv4-mapped address) bound to
        1-16 distinct labels of 1-64 printable bytes without surrounding spaces.
        See FirewallRule.identities.
      properties:
        ip: {type: string, example: 10.0.0.5}
        identities: {type: array, items: {type: string, minLength: 1, maxLength: 64}, minItems: 1, maxItems: 16}
      required: [ip, identities]
    SessionResponse:
      type: object
      properties:
        role: {type: string}
        sessionId: {type: string}
        idleTTLSeconds: {type: integer}
        maxTTLSeconds: {type: integer}
        clientIP: {type: string}
        authenticatedAs: {type: string}
        user: {$ref: '#/components/schemas/User'}
        expiresAt: {type: string, format: date-time}
        issuedAt: {type: string, format: date-time}
        lastSeen: {type: string, format: date-time}
    OsRoutingSnapshot:
      type: object
      properties:
        routes: {type: array, items: {$ref: '#/components/schemas/OsRoute'}}
        defaultRoute: {$ref: '#/components/schemas/OsRoute'}
      description: Linux kernel IPv4 routing view; non-Linux hosts return 501.
    OsRoute:
      type: object
      properties:
        dst: {type: string}
        gateway: {type: string}
        iface: {type: string}
        metric: {type: integer}
    IDSRuleSource:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        url: {type: string}
        format: {type: string, enum: [suricata, snort, yara, sigma]}
        license: {type: string}
        licenseNote: {type: string}
    FirewallRulePatch:
      type: object
      properties:
        id: {type: string}
        description: {type: string}
        sourceZones: {type: array, items: {type: string}}
        destZones: {type: array, items: {type: string}}
        sources: {type: array, items: {type: string}, description: CIDRs}
        destinations: {type: array, items: {type: string}, description: CIDRs}
        protocols:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: {type: string, example: tcp}
              port: {type: string, example: "2404", description: Single port or range "1000-2000"}
        identities: {type: array, items: {type: string}}
        ics:
          allOf:
          - {$ref: '#/components/schemas/ICSPredicate'}
          nullable: true
          description: Null clears the ICS predicate.
        action: {type: string, enum: [ALLOW, DENY, RESET, RATE_LIMIT, TAG]}
        rateLimit:
          allOf:
          - $ref: '#/components/schemas/RateLimit'
          nullable: true
          description: Null clears the rate limit.
        tag: {type: string, description: An empty string clears the tag.}
        log: {type: boolean}
        schedule:
          allOf:
          - $ref: '#/components/schemas/ScheduleConfig'
          nullable: true
          description: >-
            Merged into the stored schedule; unspecified fields are kept. Null
            clears the schedule (required before changing a rule to TAG).
    TransportCorrelationStatus:
      type: string
      enum: [resolved, wire, zone_unverified, unsupported_zone, unsupported_tuple, not_found, lookup_error, lookup_timeout, ambiguous, admission_timeout, cache_capacity, queue_overflow, mixed]
      description: >-
        Identity evidence, not proof of complete capture or delivery. wire means wire-only
        correlation (including live NFQUEUE and PCAP), without live conntrack evidence.
        mixed applies to flow rollups containing differing evidence. An issued ID remains
        present when authority or lookup failure downgrades status.
    TransportIdentityStatus:
      type: object
      properties:
        zoneStatus: {type: string, enum: [verified, zone_unverified, unsupported_zone]}
        zoneCheckedAt: {type: string, format: date-time}
        zoneError: {type: string}
        zoneSetters:
          type: array
          items:
            type: object
            properties:
              family: {type: string}
              table: {type: string}
              chain: {type: string}
              handle: {type: integer, format: uint64}
        counters:
          type: object
          additionalProperties: {type: integer, format: uint64}
          description: >-
            Sparse cumulative counters; absent keys mean zero. Authority counters are zone_checks,
            zone_read_errors, zone_setter_checks. Resolution counters are lookups, cache_hits,
            resolved, not_found, lookup_error, lookup_timeout, ambiguous, unsupported_zone,
            unsupported_tuple, zone_unverified. Admission/correlation counters are queue_overflow
            (every drop), admission_timeout, cache_capacity, coverage_capacity (unindexed tuple
            observations), coverage_index_reclaimed (expired unbound tuple histories evicted by
            the flow sweep), canceled, correlation_unavailable (emitted anomalies). No worker retries.
        modbus:
          type: object
          properties:
            matched: {type: integer, format: uint64}
            unmatched: {type: integer, format: uint64}
            unavailable: {type: integer, format: uint64}
            capacity: {type: integer, format: uint64}
            expired: {type: integer, format: uint64}
            pendingConnections: {type: integer}
            pendingTransactions: {type: integer}
    EngineRulesetStatus:
      description: >-
        The installed ruleset. A failed apply leaves it installed and in force, so ruleset, snapshotVersion,
        appliedAt and warnings keep describing it; error, failedSnapshotVersion and failedAt describe the last
        apply when it failed, until the next successful apply clears them.
      properties:
        appliedAt: {format: date-time, type: string, description: When the installed ruleset was applied; zero before the first success.}
        error: {type: string, description: Error of the last apply when it failed.}
        failedSnapshotVersion: {type: string, description: Version of the snapshot the last apply failed to install.}
        failedAt: {format: date-time, type: string, description: When the last apply failed.}
        ruleset: {type: string, description: Compiled text of the installed ruleset; empty when none is installed, as with enforcement disabled.}
        snapshotVersion: {type: string, description: Version of the installed snapshot.}
        schedulePlanner: {$ref: '#/components/schemas/SchedulePlannerStatus'}
        transportIdentity: {$ref: '#/components/schemas/TransportIdentityStatus'}
        icsCoverage:
          type: array
          items: {$ref: '#/components/schemas/ICSCoverageRule'}
          description: >-
            Live coverage of the ICS rules in force, in rule ID order, with runtime reasons. After a failed
            apply it still describes the previous rules (empty before the first success). Omitted when there are none.
        warnings:
          type: array
          items: {$ref: '#/components/schemas/RuleWarning'}
          description: Rules of the installed ruleset that match nothing or that an ALLOW shadows; omitted when there are none.
      type: object
    SchedulePlannerStatus:
      type: object
      required: [lastRefill, horizonEnd, state]
      description: >-
        The engine's schedule planner for the installed ruleset, present when it has scheduled rules. The
        kernel's schedule time sets hold windows up to horizonEnd; the planner refills them when half of the
        horizon has passed and after the wall clock steps.
      properties:
        lastRefill: {type: string, format: date-time, description: Start of the horizon the time sets hold.}
        horizonEnd: {type: string, format: date-time, description: End of that horizon; beyond it a scheduled ALLOW stops matching and a scheduled DENY applies.}
        lastError: {type: string, description: Error of the last refill when it failed; the next successful refill clears it.}
        lastErrorAt: {type: string, format: date-time}
        state:
          type: string
          enum: [ok, degraded]
          description: Degraded while a refill is failing or the horizon ends within an hour.
        reason: {type: string, description: Why the planner is degraded.}
    ICSCoverageRule:
      type: object
      required: [ruleId, protocol, mode, state]
      description: Whether a firewall rule naming an ICS protocol actually stops a prohibited command.
      properties:
        ruleId: {type: string}
        protocol: {type: string}
        mode: {type: string, enum: [monitor, enforce], description: Effective mode (rule mode, then dataplane.dpiMode, then monitor).}
        state: {type: string, enum: [monitoring, enforcing, partial, not_enforcing]}
        reasons:
          type: array
          items: {$ref: '#/components/schemas/ICSCoverageReason'}
    ICSCoverageReason:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [no-inline-path, enforcement-disabled, dpi-disabled, decoder-disabled, queue-unavailable, exclusion-overlap, domain-exclusion]
        message: {type: string}
        value: {type: string, description: The exclusion, for exclusion codes.}
        matches: {type: integer, description: Connections the exclusion exempted since the last apply; applied coverage only.}
        runtime: {type: boolean, description: True for reasons only the running engine reports (queue-unavailable).}
    ICSEnforcementHealth:
      type: object
      required: [state, enforcing, partial, notEnforcing, monitoring]
      description: Counts of applied ICS rules by coverage state; names no rule or exclusion.
      properties:
        state:
          type: string
          enum: [none, monitoring, enforcing, partial, not_enforcing, unknown]
          description: none without ICS rules, the worst state among enforce rules, monitoring when all are monitor, unknown when the engine cannot be read.
        enforcing: {type: integer}
        partial: {type: integer}
        notEnforcing: {type: integer}
        monitoring: {type: integer}
    RuleWarning:
      type: object
      required: [ruleId, action, message]
      description: >-
        A firewall rule that does not act as written. Either a rule that matches nothing
        because of the part predicate names: identities no bound address satisfies
        (identity), source or destination zones none of which has an interface (zone, listed
        in zones), or sources and destinations that share no address family
        (addressFamily). Or a DENY or RESET rule that an ALLOW shadows (shadowedBy): the
        ALLOW matches all of its traffic, so it never decides anything.
      properties:
        ruleId: {type: string}
        predicate:
          type: string
          enum: [identity, zone, addressFamily]
        zones:
          type: array
          items: {type: string}
          description: For predicate zone, the rule's zones that have no interfaces, sorted.
        shadowedBy: {type: string, description: ID of the ALLOW rule that shadows this DENY or RESET rule.}
        action: {type: string, enum: [ALLOW, DENY, RESET, RATE_LIMIT, TAG]}
        message: {type: string}
    RateLimit:
      type: object
      additionalProperties: false
      required: [packetsPerSecond]
      description: >-
        Packet policer for each directional 5-tuple (source, destination, layer-4 protocol,
        source and destination port; the protocol without ports for anything but TCP and UDP),
        on IPv4 and IPv6. Packets over the limit are dropped; nothing is queued or shaped.
      properties:
        packetsPerSecond: {type: integer, minimum: 1, maximum: 1000000}
        burst: {type: integer, minimum: 0, maximum: 1000000, description: Bucket depth in packets; 0 means packetsPerSecond.}
    RuleCounters:
      type: object
      required: [snapshotVersion, since, rules]
      properties:
        snapshotVersion: {type: string, description: Version of the applied snapshot.}
        since: {type: string, format: date-time, description: When the ruleset was applied; every apply restarts the counters at zero.}
        rules:
          type: array
          items: {$ref: '#/components/schemas/RuleCount'}
          description: One entry per firewall rule, in configuration order.
    RuleCount:
      type: object
      required: [ruleId, action, packets, bytes]
      properties:
        ruleId: {type: string}
        action: {type: string, enum: [ALLOW, DENY, RESET, RATE_LIMIT, TAG]}
        packets:
          type: integer
          format: uint64
          description: >-
            Packets the rule's nftables lines matched. A RATE_LIMIT rule counts every packet it
            meters; a TAG rule counts the connection openers it labels; a queued ICS rule counts
            the packets it sends to the engine.
        bytes: {type: integer, format: uint64}
        excessDrops: {type: integer, format: uint64, description: RATE_LIMIT only; packets dropped over the limit.}
    NetcfgManagementFault:
      properties:
        address: {type: string}
        interface: {type: string}
        reason: {type: string}
        service: {type: string}
        time: {format: date-time, type: string}
      type: object
    RulesContentMatch:
      properties:
        Depth: {type: integer}
        Distance: {type: integer}
        IsHex: {type: boolean}
        Negate: {type: boolean}
        Nocase: {type: boolean}
        Offset: {type: integer}
        Pattern: {type: string}
        Within: {type: integer}
      type: object
    RulesEntry:
      properties:
        Action: {type: string}
        DestZones: {items: {type: string}, type: array}
        Destinations: {items: {type: string}, type: array}
        ICS: {$ref: '#/components/schemas/RulesICSPredicate'}
        ID: {type: string}
        Identities: {items: {type: string}, type: array}
        Log: {type: boolean}
        Protocols: {items: {$ref: '#/components/schemas/RulesProtocol'}, type: array}
        Schedule: {$ref: '#/components/schemas/RulesSchedulePredicate'}
        SourceZones: {items: {type: string}, type: array}
        Sources: {items: {type: string}, type: array}
      type: object
    RulesICSPredicate:
      properties:
        Addresses: {items: {type: string}, type: array}
        Direction: {type: string}
        FunctionCode: {format: byte, type: string}
        Mode: {type: string}
        ObjectClasses: {items: {type: integer}, type: array}
        Protocol: {type: string}
        ReadOnly: {type: boolean}
        UnitID: {type: integer}
        WriteOnly: {type: boolean}
        ca: {items: {type: integer}, type: array}
        classes: {items: {type: string}, type: array}
        ioa: {items: {$ref: '#/components/schemas/RulesIOARange'}, type: array}
        typeIds: {items: {type: integer}, type: array}
        cot: {type: array, minItems: 1, items: {type: integer, minimum: 1, maximum: 63}, description: "IEC104 cause of transmission"}
        originators: {type: array, minItems: 1, items: {type: integer, minimum: 0, maximum: 255}, description: "IEC104 originator addresses"}
        masters: {type: array, minItems: 1, items: {type: integer, minimum: 0, maximum: 65519}, description: "DNP3 master stations; application messages only"}
        outstations: {type: array, minItems: 1, items: {type: integer, minimum: 0, maximum: 65519}, description: "DNP3 outstations; application messages only"}
        groups: {type: array, minItems: 1, items: {type: integer, minimum: 0, maximum: 255}, description: "DNP3 object groups"}
        variations: {type: array, minItems: 1, items: {type: integer, minimum: 0, maximum: 255}, description: "DNP3 variations; 0 is not a wildcard"}
        instances: {type: array, minItems: 1, items: {type: integer, minimum: 0, maximum: 65535}, description: "CIP logical instances; 8/16-bit segments only"}
        attributes: {type: array, minItems: 1, items: {type: integer, minimum: 0, maximum: 65535}, description: "CIP logical attributes; unknown for aggregate services"}
        negative: {type: boolean}
        test: {type: boolean}
        selectExecute: {type: string, enum: [select, execute]}
        tags: {type: array, minItems: 1, items: {type: string}, description: "CIP symbolic selectors; logical targets never match"}
      type: object
    RulesIDSCondition:
      properties:
        All: {items: {$ref: '#/components/schemas/RulesIDSCondition'}, type: array}
        Any: {items: {$ref: '#/components/schemas/RulesIDSCondition'}, type: array}
        Field: {type: string}
        Not: {$ref: '#/components/schemas/RulesIDSCondition'}
        Op: {type: string}
        Value: {}
      type: object
    RulesIDSConfig:
      properties:
        Enabled: {type: boolean}
        RuleGroups: {items: {$ref: '#/components/schemas/RulesRuleGroup'}, type: array}
        Rules: {items: {$ref: '#/components/schemas/RulesIDSRule'}, type: array}
      type: object
    RulesIDSRule:
      properties:
        Action: {type: string}
        CVE: {items: {type: string}, type: array}
        ContentMatches: {items: {$ref: '#/components/schemas/RulesContentMatch'}, type: array}
        ConversionNotes: {items: {type: string}, type: array}
        Description: {type: string}
        DstAddr: {type: string}
        DstPort: {type: string}
        Enabled: {type: boolean}
        ID: {type: string}
        Kind: {type: string}
        Labels: {additionalProperties: {type: string}, type: object}
        MITREAttackIDs: {items: {type: string}, type: array}
        Message: {type: string}
        Proto: {type: string}
        RawSource: {type: string}
        References: {items: {type: string}, type: array}
        Severity: {type: string}
        SourceFormat: {type: string}
        SrcAddr: {type: string}
        SrcPort: {type: string}
        Title: {type: string}
        When: {$ref: '#/components/schemas/RulesIDSCondition'}
        YARAStrings: {items: {$ref: '#/components/schemas/RulesYARAString'}, type: array}
      type: object
    RulesIOARange:
      properties:
        end: {type: integer}
        start: {type: integer}
      type: object
    RulesLocalServiceRule:
      properties:
        DeniedIfaces: {items: {type: string}, type: array}
        ID: {type: string}
        Ifaces: {items: {type: string}, type: array}
        Port: {type: integer}
        Proto: {type: string}
        RecoverUnbound: {type: boolean}
        Zone: {type: string}
      type: object
    RulesNATConfig:
      properties:
        EgressZone: {type: string}
        Enabled: {type: boolean}
        PortForwards: {items: {$ref: '#/components/schemas/RulesPortForward'}, type: array}
        SourceZones: {items: {type: string}, type: array}
      type: object
    RulesPortForward:
      properties:
        AllowedSources: {items: {type: string}, type: array}
        Description: {type: string}
        DestIP: {type: string}
        DestPort: {type: integer}
        Enabled: {type: boolean}
        ID: {type: string}
        IngressZone: {type: string}
        ListenPort: {type: integer}
        Proto: {type: string}
      type: object
    RulesProtocol:
      properties:
        Name: {type: string}
        Port: {type: string}
      type: object
    RulesRuleGroup:
      properties:
        Description: {type: string}
        Enabled: {type: boolean}
        Filter: {type: string}
        ID: {type: string}
        Name: {type: string}
        RuleCount: {type: integer}
      type: object
    RulesIdentityBinding:
      properties:
        IP: {type: string}
        Identities: {items: {type: string}, type: array}
      type: object
    RulesSchedulePredicate:
      properties:
        DaysOfWeek: {items: {type: string}, type: array}
        EndTime: {type: string}
        StartTime: {type: string}
        Timezone: {type: string}
      type: object
    RulesSnapshot:
      properties:
        Default: {type: string}
        Firewall: {items: {$ref: '#/components/schemas/RulesEntry'}, type: array}
        Gate: {$ref: '#/components/schemas/RulesGateSelection'}
        IDS: {$ref: '#/components/schemas/RulesIDSConfig'}
        IdentityBindings: {items: {$ref: '#/components/schemas/RulesIdentityBinding'}, type: array, description: Sorted by address.}
        LocalInput: {items: {$ref: '#/components/schemas/RulesLocalServiceRule'}, type: array}
        NAT: {$ref: '#/components/schemas/RulesNATConfig'}
        Version: {type: string}
        ZoneIfaces: {additionalProperties: {items: {type: string}, type: array}, type: object}
      type: object
    RulesGateSelection:
      description: >-
        The compiled scan selection. Enabled is false, with empty entries and zones, when the
        gate intercepts nothing. Zone, asset and CIDR references are resolved to devices and
        prefixes; the effective destination is matched.
      properties:
        Enabled: {type: boolean}
        Include: {items: {$ref: '#/components/schemas/RulesGateEntry'}, type: array}
        Exclude: {items: {$ref: '#/components/schemas/RulesGateEntry'}, type: array}
        Zones: {items: {$ref: '#/components/schemas/RulesGateZone'}, type: array, description: Every egress zone an include entry references}
        ICSDevices: {items: {type: string}, type: array, description: Devices of the ICS-marked zones}
        ICSCIDRs: {items: {type: string}, type: array, description: Subnets of the ICS-marked zones' interfaces and addresses of the ICS-marked assets}
        FailPolicy: {type: string, enum: [open, closed]}
        DownloadMode: {type: string, enum: [hold, stream_tail]}
      type: object
    RulesGateEntry:
      description: >-
        One resolved include or exclude entry. An include entry names its egress zones in
        DestZones; an exclude entry carries egress devices in DestDevices and may constrain
        addresses, in which case Family is 4 or 6 and the prefixes are of that family alone.
      properties:
        SourceDevices: {items: {type: string}, type: array, description: Ingress devices; empty means any}
        DestZones: {items: {type: string}, type: array, description: Include entries only; names in Zones}
        DestDevices: {items: {type: string}, type: array, description: Exclude entries only; empty means any}
        Family: {type: integer, enum: [0, 4, 6], description: 0 when the entry has no address constraint}
        Sources: {items: {type: string}, type: array, description: CIDRs; exclude entries only}
        Destinations: {items: {type: string}, type: array, description: CIDRs; exclude entries only}
        Ports: {items: {$ref: '#/components/schemas/RulesGatePortRange'}, type: array, description: Empty means any port; exclude entries only}
      type: object
    RulesGateZone:
      properties:
        Name: {type: string}
        Index: {type: integer, minimum: 1, maximum: 255, description: The egress zone index written into the connection mark}
        Devices: {items: {type: string}, type: array}
      type: object
    RulesGatePortRange:
      properties:
        Lo: {type: integer}
        Hi: {type: integer}
      type: object
    RulesYARAString:
      properties:
        ASCII: {type: boolean}
        Name: {type: string}
        Nocase: {type: boolean}
        Pattern: {type: string}
        Type: {type: string}
        Wide: {type: boolean}
      type: object
    MeResponse:
      type: object
      properties:
        id: {type: string}
        username: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string}
        role: {type: string, enum: [admin, view]}
        mustChangePassword: {type: boolean}
        mfaEnabled: {type: boolean}
        mfaRequired: {type: boolean}
        mfaGraceUntil: {type: string, format: date-time}
        labMode: {type: boolean}
    MFAPolicyResponse:
      allOf:
      - {$ref: '#/components/schemas/StatusResponse'}
      - type: object
        properties:
          graceUntil:
            type: string
            format: date-time
    FactoryResetResponse:
      type: object
      properties:
        status:
          type: string
        loggedOut:
          type: boolean
          description: The auth cookie is cleared and the client should log out; lab web/API tokens are not revoked.
        message:
          type: string
        warnings:
          type: array
          description: Auxiliary apply or audit cleanup failures; nonempty means runtime convergence is incomplete.
          items: {type: string}
  parameters:
    pathId:
      name: id
      in: path
      required: true
      schema: {type: string}
  headers:
    Staged:
      description: Candidate edit only; not active until committed.
      schema: {type: string, enum: [staged]}
    Committed:
      description: Commit or rollback applied running configuration; confirm only canceled the pending rollback deadline.
      schema: {type: string, enum: [committed]}
    Warnings:
      description: >
        Repeated values describe best-effort auxiliary infrastructure warnings
        (interfaces, routing, engine services including DHCP redirect, IPv4
        forwarding and PCAP), not ruleset or dataplane configuration failures.
        A services: warning also reports a scan selection that intercepts or
        exempts less than it reads (a zone without an interface, an asset
        without an address, a closed fail policy without ICS endpoints) and an
        AV backend still starting when the apply ended, which leaves the
        scanning gate pending until it is ready.
        Across multiple bound zones, disabled forwarding includes "ipv4 forwarding
        is disabled (net.ipv4.ip_forward=0); routed traffic will not pass".
      schema: {type: string}

paths:
  /diagnostics/iec104:
    get:
      tags: [Diagnostics]
      summary: Read IEC 104 holdback pressure and fixed limits
      description: Separate from IEC enforcement health. Available to authenticated readers; engine unavailability is an error, never zero pressure.
      responses:
        "200":
          description: Current pressure and process-lifetime totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IEC104Pressure" }
        "503":
          description: Engine diagnostics unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  # ── Health (unauthenticated) ──────────────────────────────────────
  /health:
    get:
      summary: Health check
      description: >
        Always returns HTTP 200 for liveness, not proof of enforcement. The
        top-level enforcement object reports general firewall health separately
        from IEC104 queue/reset readiness; both share one one-second observation
        budget with running metadata and fault reads. `ipv4Forwarding` reports the
        forwarding sysctl state observed in the engine's network namespace,
        or `unknown` if that state cannot be read.
      security: []
      tags: [System]
      responses:
        "200":
          description: Liveness response; inspect enforcement and IEC104 health separately
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthResponse"}

  # ── Auth ──────────────────────────────────────────────────────────
  /auth/login:
    post:
      summary: Authenticate and obtain a JWT
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginRequest"}
      responses:
        "200":
          description: Login successful or MFA challenge required
          content:
            application/json:
              schema:
                oneOf:
                - {$ref: "#/components/schemas/LoginResponse"}
                - {$ref: "#/components/schemas/MFALoginChallenge"}
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429":
          description: Rate-limited
          headers:
            Retry-After: {schema: {type: integer}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /auth/login/mfa:
    post:
      summary: Complete login with an MFA code
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MFAVerifyLoginRequest"}
      responses:
        "200":
          description: MFA verified and session created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginResponse"}
        "401":
          description: Invalid or expired challenge token or authentication code
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "429":
          description: Too many failed authentication codes for this account (outside lab mode); the code check is locked
          headers:
            Retry-After: {schema: {type: integer}}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /auth/logout:
    post:
      summary: Invalidate the current session
      security: []
      tags: [Auth]
      responses:
        "200":
          description: Logged out

          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
  /auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MeResponse'}
    patch:
      summary: Update current user profile
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateMeRequest'}
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}

  /auth/me/mfa/enroll:
    post:
      summary: Start TOTP MFA enrollment for the current user
      tags: [Auth]
      responses:
        "200":
          description: Enrollment material for a new authenticator app
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MFAEnrollResponse"}
        "409": {description: MFA already enabled, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "403": {description: MFA setup required sessions may access this endpoint even when other API access is restricted, content: {
              application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /auth/me/mfa/enable:
    post:
      summary: Enable TOTP MFA for the current user
      tags: [Auth]
      description: Ends the account's other sessions, including its SSH connections. The calling session stays signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MFAEnableRequest"}
      responses:
        "200": {description: MFA enabled, content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}}}
        "401": {description: Invalid or expired challenge token or authentication code, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "409": {description: MFA already enabled, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "403": {description: MFA setup required sessions may access this endpoint even when other API access is restricted, content: {
              application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /auth/me/mfa/disable:
    post:
      summary: Disable TOTP MFA for the current user
      tags: [Auth]
      description: Ends the account's other sessions, including its SSH connections. The calling session stays signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MFADisableRequest"}
      responses:
        "200": {description: MFA disabled, content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}}}
        "401": {description: Current password or authentication code invalid, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "409": {description: MFA is required for this account and cannot be self-disabled, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "429": {description: "Too many failed current-password or authentication-code checks for this account (outside lab mode); retry after Retry-After", headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  # ── Dashboard ─────────────────────────────────────────────────────
  /dashboard:
    get:
      summary: Aggregated dashboard data
      tags: [Dashboard]
      responses:
        "200":
          description: Dashboard payload
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DashboardResponse"}

  /system/management-reservation:
    get:
      summary: Read immutable management access and runtime guard health
      description: >
        Boot authority, not candidate or running config. Exact source peers keep
        HTTP access despite interface access toggles; normal authentication still
        applies. An unreachable engine is reported as a guard error, never healthy.
      tags: [System]
      responses:
        "200":
          description: >
            Reservation view. Without a reservation it is {"active":false}, plus
            bootFault and recovery while a boot fault holds.
          content:
            application/json:
              schema:
                type: object
                required: [active]
                properties:
                  active: {type: boolean}
                  device: {type: string}
                  local: {type: string, description: Host address with prefix length}
                  sources: {type: array, items: {type: string, format: ipv4}}
                  port: {type: integer, minimum: 1, maximum: 65535}
                  bootFault:
                    type: string
                    description: >
                      Why the stored running configuration was refused at boot:
                      its validation error, or a residual reservation conflict after
                      boot normalization; empty when clear. Blocks stored
                      service/config replay and installs a minimal enforcement-on
                      default-deny recovery ruleset instead. Without a reservation
                      that ruleset keeps the stored management listener access.
                      A safe commit, rollback or factory reset clears it.
                  recovery:
                    type: string
                    description: >
                      Empty without a bootFault. Reports "recovery: new transit
                      dropped" only when the engine confirms the exact recovery
                      ruleset applied successfully. Otherwise reports recovery
                      pending or failed; established/related traffic is not denied.
                  listenerFaults:
                    type: array
                    nullable: true
                    items: {type: string}
                    description: >
                      Boot-only optional HTTP/HTTPS/SSH/loopback listener failures.
                      Reserved HTTP remains mandatory; these diagnostics do not
                      block safe policy apply. Correct settings and restart.
                  rollbackFault:
                    type: string
                    description: Last refused rollback, retained across restarts
                  guard:
                    type: object
                    required: [active, faults]
                    properties:
                      active: {type: boolean}
                      device: {type: string}
                      local: {type: string}
                      sources: {type: array, items: {type: string, format: ipv4}}
                      port: {type: integer}
                      error: {type: string}
                      faults: {type: integer, minimum: 0}
                      lastFault: {$ref: '#/components/schemas/NetcfgManagementFault'}

  /system/factory-reset:
    post:
      summary: Reset appliance configuration and sessions (admin)
      description: >
        Preflights the autobound appliance defaults (shared with first boot) against
        the immutable management reservation before wiping users, sessions, config,
        or audit. Genuine incompatible defaults are refused without changing these
        stores. Configuration replacement uses atomic restore/reapply recovery.
        On runtime apply failure users, sessions and existing audit history are not
        wiped; successful recovery restores running, candidate, previous, pending
        rollback and the IDS bank. After runtime apply succeeds, the engine's
        temporary blocks and connection revocations are cleared; a failed clear is
        reported as a "dynamic blocks:" warning. Replacing users and
        sessions with the default admin is atomic within the users database; a
        user-reset failure preserves the prior users and sessions. Configuration
        and users are separate databases, so that failure does not undo the
        successfully applied configuration. Audit is cleared after runtime apply.
        A successful reset clears the boot fault and applies the defaults.
        The response warnings array and message report incomplete convergence when
        auxiliary applies fail; HTTP 200 alone does not guarantee convergence.
        Session-backed web/API tokens are revoked outside lab mode. Lab mode
        never looks up sessions; signed, unexpired lab tokens remain valid after
        reset even with a JWT secret. Without a secret, lab mode still accepts
        any nonempty token. The reset message reports that lab tokens remain valid.
        SSH connections are closed,
        except an initiating appliance console until it prints the result.
        The reserved management path and lab credentials are retained.
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: string, enum: [NUCLEAR]}
      responses:
        "200":
          description: Reset applied; inspect warnings for incomplete convergence and reauthenticate with default credentials
          headers:
            X-Containd-Warnings: {$ref: '#/components/headers/Warnings'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactoryResetResponse'}
        "400": {description: Invalid confirmation or defaults conflict with reserved management path, content: {application/json: {schema: {
                  $ref: '#/components/schemas/ErrorResponse'}}}}
        "403": {description: Admin role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "500":
          description: >
            Reset failed. A runtime apply failure returns ConfigApplyError with the
            restored/reapplied recovery results; users, sessions and audit are unchanged.
            A failed reapply leaves runtime health unavailable. A user-reset failure
            rolls back users and sessions but leaves the applied configuration in place.
            Other store failures return ErrorResponse.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConfigApplyError'
                  - $ref: '#/components/schemas/ErrorResponse'
              example:
                error: configuration apply failed
                detail: "ruleset: nft apply failed"
                restored: true
                reapplied: true
        "501": {description: Factory reset requires SQLite config and users stores, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "503": {description: Reset stores unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  # ── Config ────────────────────────────────────────────────────────
  /config/validate:
    post:
      summary: Validate configuration without staging (admin)
      description: >
        Uses the same structural and immutable management-reservation checks as
        persistence. Reservation errors name the field and "reserved management path".
        Disabling all ordinary interface access flags is permitted.
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Config'}
      responses:
        "200": {description: Configuration valid, content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}}}
        "400": {description: Invalid configuration or reserved management path conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "403": {description: Admin role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /config:
    get:
      summary: Get running configuration
      tags: [Config]
      responses:
        "200":
          description: Running configuration with secrets redacted and ids.rules omitted (use IDS endpoints for the bank).
          content:
            application/json: {schema: {$ref: '#/components/schemas/Config'}}
    post:
      summary: Replace candidate configuration (admin)
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Config'}
      responses:
        "200": {description: 'Configuration staged, not activated', content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}},
          headers: {X-Containd-Config: {$ref: '#/components/headers/Staged'}}}
        "403": {description: Admin role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
      description: Stages the shared candidate; commit to apply.

  /config/candidate:
    get:
      summary: Get the candidate configuration
      tags: [Config]
      responses:
        "200":
          description: Candidate configuration with secrets redacted and ids.rules omitted.
          content:
            application/json: {schema: {$ref: '#/components/schemas/Config'}}
        "404": {description: No candidate configuration, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    post:
      summary: Save a candidate configuration (admin)
      description: >-
        Validates and stages the whole config without activating it. ICS predicates decode strictly, and IEC104 enforce that cannot activate is
        rejected (see ICSPredicate). An omitted or null ids.rules means keep the existing bank; an explicit empty array clears it. GET /config
        and GET /config/candidate omit ids.rules; exports and backups include it.
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Config'}
      responses:
        "200": {description: Candidate saved, content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}}, headers: {
            X-Containd-Config: {$ref: '#/components/headers/Staged'}}}
        "400":
          description: Invalid JSON or configuration; unsupported industrial references are rejected atomically with the rule or decoder key named
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "403": {description: Admin role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /config/diff:
    get:
      summary: Review pending configuration changes
      description: >
        Server-authoritative comparison of unredacted state. Secret-only edits
        appear in changedSections without exposing their values or digests.
        running and candidate retain redacted config shapes but omit ids.rules;
        idsBank contains counts and SHA-256 digests of the ordered JSON rule arrays.
        Exports and backups, unlike config reads and diff, include the full bank.
      tags: [Config]
      responses:
        "200":
          description: Pending changes (an absent candidate is seeded from running)
          content:
            application/json:
              schema:
                type: object
                required: [changed, changedSections, running, candidate, idsBank]
                properties:
                  changed: {type: boolean}
                  changedSections: {type: array, items: {type: string}}
                  running:
                    allOf:
                    - {$ref: '#/components/schemas/Config'}
                    nullable: true
                  candidate:
                    allOf:
                    - {$ref: '#/components/schemas/Config'}
                    nullable: true
                  idsBank:
                    type: object
                    required: [running, candidate]
                    properties:
                      running: {$ref: "#/components/schemas/IDSBankSummary"}
                      candidate: {$ref: "#/components/schemas/IDSBankSummary"}

  /config/commit:
    post:
      summary: Commit candidate config and apply to data plane (admin)
      description: >
        Applies and promotes the candidate as one serialized operation. Every
        ruleset/dataplane apply failure returns 500 after attempting to restore
        and reapply pre-request running state and IDS bank. Candidate is retained
        on failure, including previous/pending state. Inspect recovery booleans;
        failed reapply leaves synchronization uncertain and is exposed in health.
        With dataplane.enforcement enabled, 200 means nft rules were installed;
        intentionally disabled enforcement only applies the in-memory snapshot.
        Auxiliary infrastructure errors may still produce warning headers;
        management service-apply failures are fatal and trigger recovery too.
        Recovery success certifies the firewall snapshot, not every network or
        service side effect. A non-2xx does not guarantee the live firewall is
        unchanged; after a disconnect, read running, candidate and health before
        retrying. A persisted recovery fault survives restarts until successful apply.
        Check health afterwards for continuing IEC104 queue/reset readiness.
        Never treat import as a fallback activation step: import only stages.
      tags: [Config]
      responses:
        "200":
          description: Commit applied
          headers:
            X-Containd-Warnings: {$ref: '#/components/headers/Warnings'}
            X-Containd-Config: {$ref: '#/components/headers/Committed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
        "400": {description: Preflight or candidate validation failed; no promotion or recovery fields, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "403": {description: Admin role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "500":
          description: Runtime apply failed; inspect recovery outcomes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigApplyError'}

  /config/import:
    post:
      summary: Import a configuration as the candidate (admin)
      description: >-
        Validates the whole config and replaces the candidate with it. It never
        changes running or activates anything: the data plane keeps its current
        policy until POST /config/commit. After importing, commit and then check
        GET /health enforcement and iec104Enforcement. Never use import as a
        fallback activation step after a failed commit. Validation is the same
        as for a candidate, including the immutable reserved management path.
        Reservation conflicts are 400 errors naming the field; running and
        candidate are unchanged. Success sets `X-Containd-Config: staged`.
      tags: [Config]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Config'}
      responses:
        "200":
          description: Candidate replaced, not activated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StatusResponse'}
          headers:
            X-Containd-Config: {$ref: '#/components/headers/Staged'}
        "400":
          description: Invalid JSON or configuration; unsupported industrial references are rejected atomically with the rule or decoder key named
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "403": {description: Admin role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "413": {description: Body larger than 10 MiB, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /config/rollback:
    post:
      summary: Roll back to previous configuration (admin)
      description: >
        Uses the same strict apply/recovery semantics as commit. On runtime
        failure, attempts to restore and reapply pre-request running state and
        IDS bank, retaining candidate, previous snapshots and pending deadline.
        Failed recovery leaves runtime synchronization uncertain; inspect health.
      tags: [Config]
      responses:
        "200": {description: Previous configuration restored and applied, content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}}, headers: {
            X-Containd-Config: {$ref: '#/components/headers/Committed'}, X-Containd-Warnings: {$ref: '#/components/headers/Warnings'}}}
        "403": {description: Admin role required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
        "400":
          description: Previous configuration unavailable or invalid; no promotion or recovery fields
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        "500":
          description: Runtime apply failed; inspect recovery outcomes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfigApplyError'}

  # ── Users (admin) ─────────────────────────────────────────────────
  /users:
    get:
      summary: List all users (admin)
      tags: [Users]
      responses:
        "200":
          description: Array of users
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/User"}
    post:
      summary: Create a user (admin)
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateUserRequest"}
      responses:
        "200":
          description: Created user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "409": {description: Username already taken, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /users/{id}:
    patch:
      summary: Update a user (admin)
      tags: [Users]
      parameters:
      - $ref: "#/components/parameters/pathId"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/User"}
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/User"}
        "404": {description: User not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}
    delete:
      summary: Delete a user (admin)
      tags: [Users]
      description: Deletes the user's sessions and closes their SSH connections.
      parameters:
      - $ref: "#/components/parameters/pathId"
      responses:
        "200": {description: User deleted, content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}}}
        "404": {description: User not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /users/{id}/mfa/disable:
    post:
      summary: Disable or reset MFA for a user (admin)
      tags: [Users]
      description: Ends the user's sessions, including SSH connections, except the calling session.
      parameters:
      - $ref: "#/components/parameters/pathId"
      responses:
        "200": {description: MFA disabled, content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}}}
        "404": {description: User not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /users/{id}/mfa/require:
    post:
      summary: Require MFA for a user (admin)
      tags: [Users]
      parameters:
      - $ref: "#/components/parameters/pathId"
      responses:
        "200": {description: 'MFA requirement enabled, with grace period if setup is still pending', content: {application/json: {schema: {
                  $ref: '#/components/schemas/MFAPolicyResponse'}}}}
        "404": {description: User not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /users/{id}/mfa/clear:
    post:
      summary: Clear the MFA requirement for a user (admin)
      tags: [Users]
      parameters:
      - $ref: "#/components/parameters/pathId"
      responses:
        "200": {description: MFA requirement cleared, content: {application/json: {schema: {$ref: '#/components/schemas/StatusResponse'}}}}
        "404": {description: User not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}}

  /users/{id}/mfa/grace:
    post:
      summary: Extend the MFA setup grace period for a user (admin)
      tags: [Users]
      parameters:
      - $ref: "#/components/parameters/pathId"
      responses:
