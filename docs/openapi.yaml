openapi: "3.0.3"
info:
  title: containd API
  version: "1.0.0"
  description: |
    REST API for containd, relative to /api/v1.
    Normal authentication is a session-backed JWT from POST /auth/login (or
    POST /auth/login/mfa). Send Authorization: Bearer <token> or the HttpOnly
    containd_token cookie. Cookie-authenticated writes enforce same-origin checks.
    Lab mode grants admin access to a supplied token (a JWT is verified when a
    signing secret is configured). Static admin/auditor bearer tokens are a
    fallback only when the user store or JWT secret is unavailable.
    Persisted configuration edits stage a shared candidate. Reads of editable
    settings use that candidate; commit promotes and applies it. Operational
    commands remain immediate. Authentication and authorization errors use
    ErrorResponse; protected operations may return 401, 403 or 503. Admin-only
    operations say so in their summary.
  license:
    name: Apache-2.0

servers:
- url: /api/v1
  description: Default API base path

security:
- bearerAuth: []
- cookieAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Session JWT in normal mode; configured static bearer token in fallback mode. Lab tokens are not production authentication.

    cookieAuth:
      type: apiKey
      in: cookie
      name: containd_token
      description: Session cookie set by login; cookie-authenticated browser writes require an allowed Origin.
  schemas:
    IEC104Pressure:
      type: object
      description: Observational pressure; totals persist until the engine process restarts.
      required: [heldPackets, heldBytes, oldestPendingSeconds, activeSessions, trackedSessions, limits, aborts, resetWorkerRejections, verdictFailures, injectorFailures]
      properties:
        heldPackets: { type: integer, minimum: 0 }
        heldBytes: { type: integer, minimum: 0, description: Held payload bytes including retransmissions }
        oldestPendingSeconds: { type: number, minimum: 0, description: Zero when no packet is held }
        activeSessions: { type: integer, minimum: 0, description: Live incarnations including replacement handshakes; zero after capture shutdown }
        trackedSessions: { type: integer, minimum: 0, description: Tuple slots including closed sessions and abort tombstones }
        limits:
          type: object
          description: Fixed limits, not configurable settings
          required: [heldPackets, heldPacketsPerSession, heldBytesPerSession, pendingSeconds, sessions, resetWorkerJobs]
          properties:
            heldPackets: { type: integer, enum: [256] }
            heldPacketsPerSession: { type: integer, enum: [32] }
            heldBytesPerSession: { type: integer, enum: [65536] }
            pendingSeconds: { type: number, enum: [1] }
            sessions: { type: integer, enum: [4096] }
            resetWorkerJobs: { type: integer, enum: [256], description: Shared reset and dynamic-block worker queue }
        aborts:
          type: object
          description: Session aborts plus fail-closed admission or steering rejections, per occurrence (not unique denied commands)
          required: [deny, timeout, bound, midstream, fail_close, injector, stream, framing, transport, policy, queue, unhealthy]
          additionalProperties: false
          properties:
            deny: { type: integer, format: int64, minimum: 0 }
            timeout: { type: integer, format: int64, minimum: 0 }
            bound: { type: integer, format: int64, minimum: 0 }
            midstream: { type: integer, format: int64, minimum: 0 }
            fail_close: { type: integer, format: int64, minimum: 0 }
            injector: { type: integer, format: int64, minimum: 0 }
            stream: { type: integer, format: int64, minimum: 0 }
            framing: { type: integer, format: int64, minimum: 0 }
            transport: { type: integer, format: int64, minimum: 0 }
            policy: { type: integer, format: int64, minimum: 0 }
            queue: { type: integer, format: int64, minimum: 0 }
            unhealthy: { type: integer, format: int64, minimum: 0 }
        injectorFailures: { type: integer, format: int64, minimum: 0, description: Failed TCP reset injection attempts }
        resetWorkerRejections: { type: integer, format: int64, minimum: 0 }
        verdictFailures:
          type: integer
          format: int64
          minimum: 0
          description: Shared inline verdict failures plus rejected IEC holdback settlement requests; intentional queue closures are excluded

    IDSBankSummary:
      type: object
      required: [count, sha256]
      properties:
        count: {type: integer, minimum: 0}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string}
        password: {type: string, format: password}

    LoginResponse:
      type: object
      properties:
        token: {type: string, description: Signed JWT}
        expiresAt: {type: string, format: date-time}
        user: {$ref: "#/components/schemas/User"}
      required: [token, expiresAt, user]

    MFALoginChallenge:
      type: object
      properties:
        mfaRequired: {type: boolean, enum: [true]}
        mfaMethod: {type: string, example: totp}
        mfaChallengeToken: {type: string}
        user: {$ref: "#/components/schemas/User"}
      required: [mfaRequired, mfaMethod, mfaChallengeToken, user]

    MFAVerifyLoginRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: {type: string}
        code: {type: string}

    MFAEnrollResponse:
      type: object
      properties:
        secret: {type: string}
        otpauthURL: {type: string, format: uri}
        qrDataURL: {type: string}
        challengeToken: {type: string}

    MFAEnableRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken: {type: string}
        code: {type: string}

    MFADisableRequest:
      type: object
      required: [currentPassword, code]
      properties:
        currentPassword: {type: string, format: password}
        code: {type: string}

    User:
      type: object
      properties:
        id: {type: string}
        username: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string}
        role: {type: string, enum: [admin, view]}
        mustChangePassword: {type: boolean}
        mfaEnabled: {type: boolean}
        mfaRequired: {type: boolean}
        mfaGraceUntil: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    CreateUserRequest:
      type: object
      required: [username, role, password]
      properties:
        username: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        email: {type: string}
        role: {type: string, enum: [admin, view]}
        password: {type: string, format: password}

    ErrorResponse:
      type: object
      properties:
        error: {type: string, description: Human-readable error message}
        detail: {type: string, description: Optional additional context}

    HealthResponse:
      type: object
      properties:
        status: {type: string, example: ok}
        component: {type: string, example: mgmt}
        build: {type: string}
        commit: {type: string}
        hostname: {type: string}
        time: {type: string, format: date-time}
        iec104Enforcement: {$ref: "#/components/schemas/IEC104Enforcement"}
        enforcement: {$ref: "#/components/schemas/EnforcementHealth"}
        icsEnforcement: {$ref: "#/components/schemas/ICSEnforcementHealth"}
        ipv4Forwarding:
          type: string
          enum: [enabled, disabled, unknown]
          description: IPv4 forwarding sysctl state in the engine namespace; unknown if unreadable or unreachable.
        managementBinding:
          type: object
          description: Unbound appliances accept recovery ports on existing NICs not explicitly denied.
          properties:
            state: {type: string, enum: [configured, unbound-appliance, unknown]}
            recoveryPorts: {type: array, items: {type: integer}}
        managementRecovery:
          type: object
          required: [state, reason]
          description: >
            Boot recovery after the stored running configuration was refused at
            boot, with or without a management reservation. Active means the
            engine applied the fail-closed recovery ruleset (new transit dropped);
            pending and failed mean it is not applied. The reason is generic: the
            refusal itself is in GET /system/management-reservation. While
            recovery holds, enforcement reports unavailable.
          properties:
            state: {type: string, enum: [inactive, active, pending, failed, unknown]}
            reason: {type: string, description: Generic summary; empty when inactive}

    IEC104Enforcement:
      type: object
      required: [active, healthy, reason]
      description: >
        IEC 60870-5-104 enforcement state of the running engine. The
        endpoint keeps HTTP 200 liveness whatever this object says.
        Inactive with no fault is {active: false, healthy: true, reason: ""}.
        If the management plane cannot reach the engine it reports
        {active: false, healthy: false, reason: "engine unreachable"}; it
        never reports healthy without the engine.
      properties:
        active:
          type: boolean
          description: >
            At least one IEC104 enforce envelope is loaded in the runtime.
            This describes the applied policy, not the saved config.
        healthy:
          type: boolean
          description: >
            False after a queue bind, verdict submission, reset send,
            reset injector or bounded-worker failure. IEC104 envelope
            traffic then fails closed until readiness returns.
        reason: {type: string, description: "Cause when IEC104 is unhealthy, else empty"}
      example: {active: true, healthy: true, reason: ""}

    EnforcementHealth:
      type: object
      required: [state, reason]
      additionalProperties: false
      description: >
        General firewall health, separate from IEC104 queue/reset health.
        Health stays HTTP 200 and shares one one-second observation budget.
        Persisted replay/recovery faults take precedence over configured mode
        and yield unavailable with a generic reason, never private nft policy
        diagnostics. Metadata reads wait through brief store contention within
        the shared budget, yielding unknown if it expires rather than exposing
        unapplied running state or waiting indefinitely for commit/recovery.
        Management binding is also unknown
        when that snapshot or its engine observation cannot be read in time.
      properties:
        state:
          type: string
          enum: [enforcing, degraded, disabled, unavailable, unknown]
          description: >
            Enforcing means enforcement enabled and an applied ruleset without
            error. Degraded means a ruleset is in force but the last apply
            failed, leaving the previous ruleset in force, or the schedule
            planner is degraded (a failing refill, or a schedule horizon that
            ends within an hour). Disabled means
            dataplane.enforcement is false. Unavailable means a ruleset apply
            failure with no ruleset in force, a persisted replay/recovery fault,
            or no applied ruleset while enforcement is on. Unknown means
            required config/fault or engine state could not be read within the
            budget.
        reason: {type: string, description: Generic summary for degraded, unavailable or unknown; otherwise empty}
      example: {state: enforcing, reason: ""}

    ConfigApplyError:
      type: object
      required: [error, detail, restored, reapplied]
      properties:
        error: {type: string, example: configuration apply failed}
        detail: {type: string, description: Original runtime apply failure}
        restored: {type: boolean, description: Pre-request stored state and IDS bank restored}
        reapplied: {type: boolean, description: Restored snapshot successfully reapplied}
        restoreError: {type: string, description: Present when stored-state restoration failed}
        reapplyError: {type: string, description: Present when reapply failed or could not be attempted}
        healthError: {type: string, description: Present when recovery health could not be persisted}

    PcapFilter:
      type: object
      description: >
        Packet filter. Port matches either the TCP/UDP source or destination
        port; it is not valid with proto icmp.
      properties:
        src: {type: string, description: Source IPv4 address or CIDR}
        dst: {type: string, description: Destination IPv4 address or CIDR}
        proto: {type: string, enum: [any, tcp, udp, icmp], default: any}
        port:
          type: string
          pattern: '^[0-9]+(-[0-9]+)?$'
          example: "2404"
          description: Single port 1–65535 or inclusive range, e.g. 1000-2000

    PcapConfig:
      type: object
      description: >
        Capture selections are resolved when capture starts against the
        running interface and zone configuration. Interface and zone
        selections are unioned and deduplicated.
      properties:
        enabled: {type: boolean}
        interfaces:
          type: array
          items: {type: string}
          description: Logical interface name or existing kernel device name
        zones:
          type: array
          items: {type: string}
          description: Capture every configured interface assigned to these zones
        snaplen: {type: integer, minimum: 0}
        maxSizeMB: {type: integer, minimum: 0}
        maxFiles: {type: integer, minimum: 0}
        mode: {type: string, enum: [rolling, once]}
        promisc: {type: boolean}
        bufferMB: {type: integer, minimum: 0}
        rotateSeconds: {type: integer, minimum: 0}
        filePrefix: {type: string}
        filter: {$ref: "#/components/schemas/PcapFilter"}
        forwardTargets: {type: array, items: {$ref: '#/components/schemas/PCAPForwardTarget'}}

    PcapStatus:
      properties:
        interfaces: {items: {type: string}, type: array}
        lastError: {type: string}
        running: {type: boolean}
        startedAt: {format: date-time, type: string}
      type: object

      required: [running]
    DashboardResponse:
      type: object
      properties:
        health:
          type: object
          properties:
            status: {type: string}
            component: {type: string}
            build: {type: string}
            commit: {type: string}
            hostname: {type: string}
            time: {type: string, format: date-time}
            labMode: {type: boolean}
        counts:
          type: object
          properties:
            assets: {type: integer}
            zones: {type: integer}
            interfaces: {type: integer}
            rules: {type: integer}
            icsRules: {type: integer}
        eventStats:
          type: object
          properties:
            total: {type: integer}
            idsAlerts: {type: integer}
            modbusWrites: {type: integer}
            avDetections: {type: integer}
            avBlocks: {type: integer}
        services: {type: object}
        user: {type: object}
        lastActivity:
          allOf:
          - {$ref: '#/components/schemas/AuditRecord'}
          nullable: true

    Event:
      type: object
      properties:
        id: {type: integer, format: uint64}
        flowId: {type: string}
        transportConnectionId:
          type: string
          description: Local transport connection incarnation established from verified O/R evidence; retained across later evidence failures. Directional flowId and wire endpoints are unchanged.
        correlationStatus: {$ref: '#/components/schemas/TransportCorrelationStatus'}
        proto: {type: string}
        kind:
          type: string
          description: >-
            Event kind. dpi.correlation.unavailable reports a dropped correlation observation
            (queue_overflow), rate-limited to one event per second; carries wire endpoints,
            flowId, protocol/transport hints and an existing transportConnectionId when known,
            not decoded payload evidence. The queue_overflow counter counts every drop.
        attributes:
          type: object
          additionalProperties: true
          description: >-
            Event-specific attributes. Events of a flow that TAG rules label carry the labels
            as tags, a sorted array of strings. identify/identification uses IdentificationAttributes.
            Passive decoder output carries observation_only true and binding_source observation.
          properties:
            observation_only: {type: boolean, description: True only for passive observation decoding; no verdict authority.}
            binding_source: {type: string, enum: [observation]}
        timestamp: {type: string, format: date-time}
        srcIp: {type: string}
        dstIp: {type: string}
        srcPort: {type: integer}
        dstPort: {type: integer}
        transport: {type: string, enum: [tcp, udp]}
        hash: {type: string}

    EventPage:
      type: object
      required: [events, historyTruncated]
      properties:
        events:
          type: array
          items: {$ref: "#/components/schemas/Event"}
        nextCursor:
          type: string
          description: Opaque exclusive upper bound for the next older page; absent at the end of retained matches.
        historyTruncated:
          type: boolean
          description: Conservative warning that history may be incomplete, not a per-session loss count. True after any store overflow or
            when merged service history cannot be certified.
        engineError:
          type: string
          description: Engine query failed; events may still contain matching service evidence. Never interpret this as an empty successful
            engine search.

    FlowSummary:
      type: object
      properties:
        flowId: {type: string}
        transportConnectionId:
          type: string
          description: Shared transport identity without bidirectional regrouping; omitted only when retained events have differing nonempty IDs, not merely differing evidence status.
        correlationStatus: {$ref: '#/components/schemas/TransportCorrelationStatus'}
        session_id:
          type: string
          description: >
            IEC104 session incarnation that groups this rollup (both wire
            directions of one connection). Absent for non-IEC flows.
        firstSeen: {type: string, format: date-time}
        lastSeen: {type: string, format: date-time}
        srcIp: {type: string}
        dstIp: {type: string}
        srcPort: {type: integer}
        dstPort: {type: integer}
        transport: {type: string}
        application:
          type: string
          description: Confirmed bound protocol, otherwise legacy decoder protocol; never a utility marker.
        identification: {$ref: '#/components/schemas/IdentificationAttributes'}
        eventCount: {type: integer, format: uint64}
        avDetected: {type: boolean}
        avBlocked: {type: boolean}
        tags:
          type: array
          items: {type: string}
          description: Sorted TAG labels the flow's events carry; omitted when they carry none.

    FirewallRule:
      type: object
      required: [id, action]
      properties:
        id: {type: string}
        description: {type: string}
        sourceZones: {type: array, items: {type: string}}
        destZones: {type: array, items: {type: string}}
        sources: {type: array, items: {type: string}, description: CIDRs}
        destinations: {type: array, items: {type: string}, description: CIDRs}
        protocols:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: {type: string, example: tcp}
              port: {type: string, example: "2404", description: Single port or range "1000-2000"}
        identities:
          type: array
          items: {type: string}
          description: >-
            Matches a connection whose opener address firewall.identityBindings binds
            to any of these labels (exact, case-sensitive). An unbound opener matches
            no identity rule, ALLOW or DENY. Removing a binding also stops established
            connections that only a conditional ALLOW admitted.
        ics:
          allOf:
          - $ref: "#/components/schemas/ICSPredicate"
          description: Always present in serialized rules; `{}` denotes no ICS predicate.
        action:
          type: string
          enum: [ALLOW, DENY, RESET, RATE_LIMIT, TAG]
          description: >-
            ALLOW, DENY and RESET decide: a packet is allowed if any matching ALLOW exists,
            otherwise the first matching DENY or RESET by rule ID decides, otherwise
            firewall.defaultAction. RESET rejects back to the sender (TCP reset for TCP,
            ICMP or ICMPv6 administratively prohibited otherwise). RATE_LIMIT and TAG are
            effects that never admit traffic. RESET, RATE_LIMIT and TAG take no ICS protocol.
        rateLimit:
          allOf:
          - $ref: '#/components/schemas/RateLimit'
          description: Required for RATE_LIMIT, forbidden otherwise.
        tag:
          type: string
          pattern: '^[a-z0-9][a-z0-9_.-]{0,31}$'
          description: >-
            Required for TAG, forbidden otherwise. A config uses at most 32 distinct labels.
            A TAG rule takes no schedule.
        log:
          type: boolean
          description: >-
            Log matching traffic as firewall.rule.hit events. A RATE_LIMIT rule logs the
            packets it drops over the limit; a TAG rule logs the connections it labels.
        schedule:
          allOf:
          - $ref: '#/components/schemas/ScheduleConfig'
          description: >-
            Recurring window, enforced by nftables time sets on the rules it decides and
            by the engine on ICS rules NFQUEUE steers to it. When a window ends,
            established connections that only a scheduled ALLOW admitted stop; when a
            scheduled DENY window opens, it applies to established connections too.

    ICSPredicate:
      type: object
      additionalProperties: false
      description: |
        ICS predicate of a firewall rule. Decoding is strict: unknown keys
        (exact spelling) and duplicate keys are rejected. `{}` is a pure
        L3/L4 rule. Semantic values need `protocol`. OR within a list, AND
        across fields; an absent field matches any value.

        New lists reject null, empty arrays and null items on create/replace;
        omit for ANY. The general /firewall/rules/{id} merge PATCH uses null
        to clear any known ICS key and omission to retain it. The ICS-specific
        /firewall/ics-rules/{id} PATCH replaces the whole rule (omitted = ANY).
        Preview receives the full effective predicate, never removal nulls.
        Each object is judged independently under ALLOW-first precedence;
        any denied object denies the message. Incomplete inspection adds an
        unknown-object context: object-qualified ALLOW fails, object-qualified
        DENY matches, with all other constraints still required.
        DNP3 station selectors apply only to application messages, not link-only
        frames. addresses selects points and requires groups. Wire variation 0
        matches ALLOW only when 0 is listed, and any variation-constrained DENY.
        DNP3/CIP reject unitId. CIP tags cannot combine with logical selectors;
        tag matching ignores case and element indexes and selects subtrees.
        ALLOW requires selector-prefix-of-target; DENY matches either prefix
        direction. Logical targets never match tags; prefer tag ALLOW with
        default deny. Unknown objects/instances/attributes fail constrained
        ALLOW and match constrained DENY; absent values otherwise fail both.

        IEC 60870-5-104 (`protocol: iec104`):
        - `typeIds`, `classes`, `ca`, `ioa`, `cot`, `originators`,
          `negative`, `test` and `selectExecute` are iec104-only. `null`, `[]`
          and null items are rejected; omit the field to match any value.
          Numbers must be JSON integers.
        - `functionCode`, `unitId`, `addresses`, `objectClasses` and
          `writeOnly` are rejected on iec104 when present at all, so
          `"writeOnly": false` is an error.
        - IEC104 rules match the session tuple (client = TCP opener,
          server port 2404) whatever the wire direction; `direction` selects
          the half. Inside the IEC104 envelope only iec104 rules are
          evaluated with ALLOW-first precedence; no match is DENY regardless of
          `firewall.defaultAction`.
        - An enforce ALLOW rule may name only Type IDs with a decoder
          descriptor (1, 3, 5, 7, 9, 11, 13, 15, 21, 30-37, 45-51, 58-64, 70, 100-103, 105, 107) and
          not the `unknown` class. Broadcast (CA 65535) and malformed
          objects never match an ALLOW.
        - IEC104 enforce (effective mode: rule `mode`, else
          `dataplane.dpiMode`, else monitor) is rejected on save, candidate,
          commit and import unless `dataplane.dpiEnabled` is true,
          `dataplane.dpiIcsProtocols.iec104` is not false,
          `dataplane.nfqueueGroup` is non-zero (NFQUEUE capture), and no
          IP/CIDR `dataplane.dpiExclusions` entry overlaps an enforce rule's
          sources or destinations.
        - Any other rule naming an ICS protocol whose effective mode is enforce
          is rejected on save, candidate, commit and import while
          `dataplane.nfqueueGroup` is 0.
      properties:
        protocol:
          type: string
          enum: [modbus, dnp3, iec104, cip]
          description: 'Unsupported names return 400: rule <id> ics protocol "<name>" is not supported; supported: modbus, dnp3, iec104, cip'
        functionCode:
          description: >
            Function/service codes (not iec104). Accepted forms: integer
            array, a single integer, numeric strings, an index-keyed
            object, legacy base64 string, or null.
          oneOf:
          - {type: array, items: {type: integer, minimum: 0, maximum: 255}}
          - {type: integer, minimum: 0, maximum: 255}
          - {type: string}
          - {type: object, additionalProperties: true}
          nullable: true
        unitId: {type: integer, minimum: 0, maximum: 255, description: "Modbus-only unit id; rejected on DNP3/CIP"}
        addresses: {type: array, items: {type: string}, description: "Closed decimal/0x ranges: Modbus registers/coils 0-65535 or DNP3 point indexes 0-4294967295 (requires groups). ALLOW contains every span; DENY overlaps any span. CIP rejects addresses; IEC104 uses ca/ioa."}
        objectClasses: {type: array, items: {type: integer, minimum: 0, maximum: 65535}, description: CIP logical object classes (cip only)}
        readOnly:
          type: boolean
          description: >
            Match read-only traffic only. On iec104: monitor-class responses,
            GI (100) and read (102) requests, end of initialization (70),
            S-frames and U-frames. false is no constraint, never "writes
            only".
        writeOnly: {type: boolean, description: Match positively classified writes and controls (not iec104)}
        direction: {type: string, enum: [request, response]}
        mode: {type: string, enum: ["", monitor, enforce], description: "Requires ics.protocol. Monitor observes every match without admitting, dropping or holding traffic; enforcing rules and strict scopes remain independent. Empty or absent inherits dataplane.dpiMode (default monitor); null or empty clears a stored override. learn is rejected; use monitor."}
        typeIds:
          type: array
          minItems: 1
          items: {type: integer, minimum: 1, maximum: 255}
          description: IEC104 Type IDs, a numeric array (never base64)
        classes:
          type: array
          minItems: 1
          items: {type: string, enum: [monitor, control, system, unknown]}
        ca:
          type: array
          minItems: 1
          items: {type: integer, minimum: 0, maximum: 65534}
          description: IEC104 common addresses; 65535 (broadcast) is rejected
        ioa:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/IOARange"}
          description: IEC104 information object address ranges; duplicates and overlaps are rejected
        cot:
          type: array
          minItems: 1
          items: {type: integer, minimum: 1, maximum: 63}
          description: IEC104 cause of transmission
        originators:
          type: array
          minItems: 1
          items: {type: integer, minimum: 0, maximum: 255}
          description: IEC104 originator addresses
        masters:
          type: array
          minItems: 1
          items: {type: integer, minimum: 0, maximum: 65519}
          description: DNP3 master stations; application messages only
        outstations:
          type: array
          minItems: 1
          items: {type: integer, minimum: 0, maximum: 65519}
          description: DNP3 outstations; application messages only
        groups:
          type: array
          minItems: 1
          items: {type: integer, minimum: 0, maximum: 255}
          description: DNP3 object groups
        variations:
          type: array
          minItems: 1
          items: {type: integer, minimum: 0, maximum: 255}
          description: DNP3 variations; 0 is not a wildcard
        instances:
          type: array
          minItems: 1
          items: {type: integer, minimum: 0, maximum: 65535}
          description: CIP logical instances; 8/16-bit segments only
        attributes:
          type: array
          minItems: 1
          items: {type: integer, minimum: 0, maximum: 65535}
          description: CIP logical attributes; unknown for aggregate services
        negative: {type: boolean, description: "IEC104 exact P/N bit; false is a restriction"}
        test: {type: boolean, description: "IEC104 exact T bit; false is a restriction"}
        selectExecute: {type: string, enum: [select, execute], description: "IEC104 S/E qualifier; typeIds omitted or subset of 45-50 and 58-63, excluding bitstrings 51/64"}
        tags:
          type: array
          minItems: 1
          items: {type: string}
          description: "CIP dot-separated symbolic names, each [A-Za-z_][A-Za-z0-9_]* up to 40 characters; optional first Program:Name. No brackets. Mutually exclusive with objectClasses/instances/attributes."
      example:
        protocol: iec104
        typeIds: [46]
        classes: [control]
        direction: request
        ca: [1]
        ioa: [{start: 65536, end: 65567}]
        mode: enforce

    IOARange:
      type: object
      additionalProperties: false
      required: [start, end]
      description: Closed range, start <= end; both keys are required, so 0 is never "missing"
      properties:
        start: {type: integer, minimum: 0, maximum: 16777215}
        end: {type: integer, minimum: 0, maximum: 16777215}
    AuditRecord:
      type: object
      properties:
        id: {type: integer, format: int64}
        timestamp: {type: string, format: date-time}
        actor: {type: string}
        source: {type: string, description: "Origin: ui, api, ssh, or cli"}
        action: {type: string}
        target: {type: string}
        result: {type: string}
        detail: {type: string}

    PolicyAnalysis:
      properties:
        eventSummary: {additionalProperties: {type: integer}, type: object}
        profiles: {items: {$ref: '#/components/schemas/LearnedProfile'}, type: array}
        rules: {items: {$ref: '#/components/schemas/FirewallRule'}, type: array}
        stats: {$ref: '#/components/schemas/PcapAnalysisResult'}
      type: object
      description: Offline analysis and suggested rules only; does not save rules, update live inventory or change live learn state.

    LearnedProfile:
      properties:
        addresses: {additionalProperties: {type: boolean}, type: object}
        destIP: {type: string}
        firstSeen: {format: date-time, type: string}
        functionCodes: {additionalProperties: {type: boolean}, type: object}
        lastSeen: {format: date-time, type: string}
        objectClasses: {additionalProperties: {type: boolean}, type: object}
        packetCount: {type: integer}
        protocol: {type: string}
        readSeen: {type: boolean}
        serviceCodes: {additionalProperties: {type: boolean}, type: object}
        sourceIP: {type: string}
        unitIDs: {additionalProperties: {type: boolean}, type: object}
        writeSeen: {type: boolean}
      type: object

    ICSTemplateInfo:
      type: object
      properties:
        name: {type: string, example: modbus_read_only}
        description: {type: string}
        protocol: {type: string, example: modbus}
        parameters:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              label: {type: string}
              type: {type: string, enum: [text, number, select]}
              required: {type: boolean}
              placeholder: {type: string}
              help: {type: string}

    ApplyICSTemplateRequest:
      type: object
      required: [template]
      properties:
        template: {type: string, description: "Template name (e.g. modbus_read_only, dnp3_secure_operations)"}
        sourceZones: {type: array, items: {type: string}}
        destZones: {type: array, items: {type: string}}
        source_zones: {type: array, items: {type: string}, deprecated: true}
        dest_zones: {type: array, items: {type: string}, deprecated: true}
        preview: {type: boolean, description: "When true, generate rules without saving them to candidate config"}
        parameters:
          type: object
          additionalProperties: {type: string}
          description: "Template parameter map used by the UI"
        params:
          type: object
          properties:
            ranges: {type: array, items: {type: string}, description: Register address ranges (legacy modbus_register_guard shape)}
        mode:
          type: string
          enum: ['', monitor, enforce]
          description: Empty inherits global DPI mode.

    RulePreviewResponse:
      type: object
      properties:
        match_count: {type: integer, description: Number of recent events matching the rule}
        sample_matches:
          type: array
          items: {$ref: "#/components/schemas/Event"}
          description: Up to 50 sample matching events
        time_range:
          type: object
          nullable: true
          properties:
            start: {type: string, format: date-time}
            end: {type: string, format: date-time}
        total_events: {type: integer, description: Total events evaluated}
        icsCoverage:
          allOf:
          - {$ref: '#/components/schemas/ICSCoverageRule'}
          description: Coverage of the previewed rule under the running engine; omitted for a rule without an ICS protocol.
        warnings:
          type: array
          items: {$ref: '#/components/schemas/RuleWarning'}
          description: >-
            Reports a rule that matches nothing under the running identity bindings and zone
            interfaces, or whose addresses share no family, which explains its zero matches.
            Omitted when there are none.
    AVConfig:
      description: >-
        Antivirus settings. A stored failOpenIcs still loads and is ignored; scan.icsZones and
        scan.icsAssets replace it. The scanning gate intercepts traffic only with enabled, at least
        one scan.include entry and httpDownload or httpUpload set.
      properties:
        cacheTtl: {type: integer, format: int64, minimum: 0, description: Native ClamAV verdict cache lifetime in nanoseconds; 0 selects 10 minutes. ICAP verdicts are never cached}
        clamav: {$ref: '#/components/schemas/ClamAVConfig'}
        enabled: {type: boolean}
        failPolicy: {type: string, enum: ["", open, closed], description: "Treatment of every unscanned outcome: open passes it, closed refuses it; empty selects open"}
        httpDownload: {type: boolean, description: Scan the response bodies of selected connections}
        httpUpload: {type: boolean, description: Scan the request bodies of selected connections}
        icap: {$ref: '#/components/schemas/ICAPConfig'}
        maxSizeBytes: {type: integer, minimum: 0, maximum: 104857600, description: Largest payload sent to the scanner; 0 means no limit. A larger object is unscanned and follows failPolicy}
        mode: {type: string, enum: ["", clamav, icap], description: "Scanning backend; empty selects clamav"}
        scan: {$ref: '#/components/schemas/ScanSelection'}
        timeoutSec: {type: integer, minimum: 0, maximum: 300, description: Backend connect and probe deadline in seconds; 0 selects 5. The gate bounds each scan to ten times this value, at least one minute}
      type: object
    ScanSelection:
      description: >-
        The traffic the scanning gate intercepts: new TCP connections the firewall routes between
        zones, port forwards included, matched on the effective (post-DNAT) destination. Exclude
        entries win over every include entry. Selecting traffic requires dataplane.enforcement, and
        no include entry may cover an ICS decoder port (502, 2222, 2404, 20000, 44818). Unknown
        keys are rejected.
      properties:
        include: {items: {$ref: '#/components/schemas/ScanInclude'}, type: array, description: Any matching entry selects the connection}
        exclude: {items: {$ref: '#/components/schemas/ScanExclude'}, type: array, description: A matching entry keeps the connection out of the gate}
        downloadMode: {type: string, enum: ["", hold, stream_tail], description: "hold delivers nothing before the verdict; stream_tail forwards a download except its last 64 KiB and resets both connections on a blocking verdict. Empty selects hold. Uploads are always held"}
        icsZones: {items: {type: string}, type: array, description: Zones whose endpoints pass unscanned outcomes under a closed fail policy; detections are still blocked}
        icsAssets: {items: {type: string}, type: array, description: Asset IDs whose addresses pass unscanned outcomes under a closed fail policy}
      type: object
    ScanInclude:
      description: Selects connections from sourceZones to destZones on destPorts; every populated field must match and an empty zone list means any zone.
      properties:
        sourceZones: {items: {type: string}, type: array}
        destZones: {items: {type: string}, type: array}
        destPorts: {items: {type: string}, type: array, description: Decimal ports or N-M ranges, from 1; at least one}
      required: [destPorts]
      type: object
    ScanExclude:
      description: Keeps matching connections out of the gate; every populated field must match and at least one must be set.
      properties:
        sourceZones: {items: {type: string}, type: array}
        destZones: {items: {type: string}, type: array}
        sources: {items: {type: string}, type: array, description: Source CIDRs}
        destinations: {items: {type: string}, type: array, description: Effective destination CIDRs}
        destPorts: {items: {type: string}, type: array, description: Decimal ports or N-M ranges}
      type: object
    AVStatus:
      description: The engine's live antivirus status; the keys beside gate are the applied settings, readiness, counters and the clamd and FreshClam state.
      type: object
      additionalProperties: true
      properties:
        available: {type: boolean, description: false when the engine cannot be reached; the entry then carries only error}
        error: {type: string}
        ready: {type: boolean}
        db_version: {type: string}
        reload_pending: {type: boolean, description: A clamd database activation is being confirmed in the background}
        gate: {$ref: '#/components/schemas/AVGateStatus'}
    AVGateStatus:
      description: The scanning gate's part of the antivirus status.
      type: object
      required: [state, enabled, fail_policy, admit, listeners, scanner, connections]
      properties:
        state:
          type: string
          enum: [off, refuse, pass, pending, open]
          description: >-
            off while the data plane does not enforce; refuse or pass, by fail policy, while a
            listener or the gate's policy routing is down; pending while the gate runs but the
            scanner is not ready, so selected objects are refused under closed and passed under
            open; open when everything is up.
        enabled: {type: boolean, description: The selection intercepts something}
        fail_policy: {type: string, enum: [open, closed]}
        admit: {type: string, enum: [open, refuse, pass], description: The admission installed in nftables for selected connections}
        admit_error: {type: string, description: Why the last admission switch failed; omitted when it succeeded}
        listeners: {items: {$ref: '#/components/schemas/AVGateListenerStatus'}, type: array}
        scanner: {$ref: '#/components/schemas/AVGateScannerStatus'}
        connections: {type: integer, description: Gated connections currently served}
        routing_error: {type: string, description: Why the gate's policy routing is not installed; omitted when it is}
        warning: {type: string, description: A host condition the gate cannot correct, such as net.ipv4.tcp_fwmark_accept enabled; omitted when there is none}
    AVGateListenerStatus:
      type: object
      required: [address, masquerade, up]
      properties:
        address: {type: string, description: Loopback address and port the listener binds}
        masquerade: {type: boolean, description: Serves connections whose upstream leg is masqueraded}
        up: {type: boolean}
        error: {type: string, description: The last bind or accept error; omitted when none}
        unavailable: {type: boolean, description: The host lacks this loopback family; the listener is not required for the open state}
    AVGateScannerStatus:
      type: object
      required: [ready]
      properties:
        ready: {type: boolean}
        error: {type: string, description: Why the scanner is not ready; omitted when it is}
    Anomaly:
      properties:
        attributes: {additionalProperties: {}, type: object}
        dest_ip: {type: string}
        message: {type: string}
        protocol: {type: string}
        severity: {type: string}
        source_ip: {type: string}
        timestamp: {format: date-time, type: string}
        type: {type: string}
      type: object
    Asset:
      properties:
        alias: {type: string}
        criticality: {type: string}
        description: {type: string}
        hostnames: {items: {type: string}, type: array, nullable: true}
        id: {type: string}
        ips: {items: {type: string}, type: array, nullable: true}
        name: {type: string}
        tags: {items: {type: string}, type: array, nullable: true}
        type: {type: string}
        zone: {type: string}
      type: object
      description: PATCH replaces the asset, retaining only omitted/empty id and name. Other omitted fields reset.
    ClamAVConfig:
      properties:
        customDefsPath: {type: string}
        freshclamEnabled: {type: boolean}
        socketPath: {type: string, description: clamd socket; empty selects /run/clamav/clamd.sock}
        updateSchedule: {type: string, description: 'FreshClam interval as a positive Go duration such as 4h; empty selects 6h. Cron syntax is rejected.'}
      type: object
    Config:
      properties:
        assets: {items: {$ref: '#/components/schemas/Asset'}, type: array, nullable: true}
        dataplane: {$ref: '#/components/schemas/DataPlaneConfig'}
        description: {type: string}
        firewall: {$ref: '#/components/schemas/FirewallConfig'}
        ids: {$ref: '#/components/schemas/IDSConfig'}
        interfaces: {items: {$ref: '#/components/schemas/Interface'}, type: array, nullable: true}
        objects: {items: {$ref: '#/components/schemas/Object'}, type: array, nullable: true}
        pcap: {$ref: '#/components/schemas/PcapConfig'}
        routing: {$ref: '#/components/schemas/RoutingConfig'}
        schema_version: {type: string}
        services: {$ref: '#/components/schemas/ServicesConfig'}
        system: {$ref: '#/components/schemas/SystemConfig'}
        version: {type: string}
        zones: {items: {$ref: '#/components/schemas/Zone'}, type: array, nullable: true}
      type: object
    ConntrackKillRequest:
      type: object
      required: [proto, src, dst]
      description: >-
        Select the original tuple from the connections list, including for NAT flows. TCP and UDP
        (IPv4 and IPv6) require sport and dport. ICMP (IPv4) and ICMPv6 (IPv6) have no ports and
        require icmpId and icmpType instead.
      properties:
        proto: {type: string, enum: [tcp, udp, icmp, icmpv6]}
        src: {type: string, description: Original source IP}
        dst: {type: string, description: Original destination IP}
        sport: {type: integer, minimum: 1, maximum: 65535, description: TCP and UDP only}
        dport: {type: integer, minimum: 1, maximum: 65535, description: TCP and UDP only}
        icmpId: {type: integer, minimum: 0, maximum: 65535, default: 0, description: ICMP and ICMPv6 only; the query identifier}
        icmpType:
          type: integer
          description: ICMP and ICMPv6 only; the original query type, which opens the connection (icmp 8, 13, 15 or 17; icmpv6 128 or 139; 8 and 128 are echo requests)
        icmpCode: {type: integer, minimum: 0, maximum: 255, default: 0, description: ICMP and ICMPv6 only}
        scope:
          type: string
          enum: [connection, client-service]
          default: connection
          description: >-
            Connection blocks the exact tuple in both directions; a fresh source port, or a new ICMP
            identifier, is allowed. Client-service ends all this client's connections to the service
            and prevents reconnects during the interval. For ICMP and ICMPv6 the service is the query
            type and code sent to the destination, so client-service ends all of the client's pings
            to that host.
        durationSecs: {type: integer, minimum: 1, maximum: 3600, default: 60}
    ConntrackKillResult:
      type: object
      required: [scope, matched, deleted, conntrackDeleted, revocationInstalled, closure]
      properties:
        scope: {type: string, enum: [connection, client-service]}
        matched: {type: integer}
        deleted: {type: integer}
        conntrackDeleted: {type: boolean, description: All matched kernel entries were deleted}
        deleteError: {type: string}
        revocationInstalled: {type: boolean}
        revocationError: {type: string}
        blockedUntil: {type: string, format: date-time}
        closure:
          type: string
          description: TCP resets are signalled on each endpoint's next matching packet, not proof of endpoint closure. UDP, ICMP and ICMPv6 matching packets are dropped.
    ConntrackEntry:
      properties:
        assured: {type: boolean}
        dport: {type: string}
        dst: {type: string}
        icmpId: {type: string, description: ICMP and ICMPv6 entries only; the query identifier of the original tuple, in place of ports}
        icmpType: {type: string, description: ICMP and ICMPv6 entries only; the query type of the original tuple}
        icmpCode: {type: string, description: ICMP and ICMPv6 entries only}
        mark: {type: string}
        proto: {type: string}
        raw: {type: string}
        replyDport: {type: string}
        replyDst: {type: string}
        replyIcmpId: {type: string, description: ICMP and ICMPv6 entries only; NAT can rewrite it}
        replyIcmpType: {type: string, description: ICMP and ICMPv6 entries only; the reply type, such as an echo reply}
        replyIcmpCode: {type: string}
        replySport: {type: string}
        replySrc: {type: string}
        sport: {type: string}
        src: {type: string}
        state: {type: string}
        timeoutSecs: {type: integer}
        tags:
          type: array
          items: {type: string}
          description: Labels of the TAG rules that match the connection's original tuple under the running ruleset; omitted when none.
      type: object
    ContentMatch:
      properties:
        depth: {type: integer}
        distance: {type: integer}
        isHex: {type: boolean}
        negate: {type: boolean}
        nocase: {type: boolean}
        offset: {type: integer}
        pattern: {type: string}
        within: {type: integer}
      type: object
    DHCPConfig:
      properties:
        authoritative:
          type: boolean
          default: false
          description: Send DHCPNAK for ineligible address requests only on directly attached served subnets; otherwise stay silent. Eligible addresses are ACKed and recorded in either mode, even without a prior lease.
        dnsServers: {items: {type: string}, type: array}
        domain: {type: string}
        enabled: {type: boolean}
        leaseSeconds: {type: integer}
        listenIfaces: {items: {type: string}, type: array}
        pools: {items: {$ref: '#/components/schemas/DHCPPool'}, type: array}
        reservations: {items: {$ref: '#/components/schemas/DHCPReservation'}, type: array}
        router: {type: string}
      type: object
    DHCPPool:
      properties:
        end: {type: string}
        iface: {type: string}
        start: {type: string}
      type: object
    DHCPReservation:
      properties:
        iface: {type: string}
        ip: {type: string}
        mac: {type: string}
      type: object
    DNSConfig:
      properties:
        cacheSizeMB: {type: integer}
        enabled: {type: boolean}
        listenPort: {type: integer}
        listenZones: {items: {type: string}, type: array}
        upstreamServers: {items: {type: string}, type: array}
      type: object
    DPIExclusion:
      properties: {reason: {type: string}, type: {type: string}, value: {type: string}}
      type: object
    DataPlaneConfig:
      properties:
        captureInterfaces: {items: {type: string}, type: array}
        dpiEnabled: {type: boolean}
        dpiExclusions: {items: {$ref: '#/components/schemas/DPIExclusion'}, type: array}
        dpiIcsParsing:
          type: object
          additionalProperties: false
          properties:
            modbus: {type: string, enum: [tolerant, strict], default: tolerant}
            dnp3: {type: string, enum: [tolerant, strict], default: tolerant}
            iec104: {type: string, enum: [tolerant, strict], default: tolerant}
            cip: {type: string, enum: [tolerant, strict], default: tolerant}
          description: >-
            Per-protocol parsing. Omitted map or keys mean tolerant; the API also accepts an empty
            string as the default. Unknown protocols or other values return 400.
            Tolerant evaluates decoded fields and alerts on nonconformance inside known-length frames.
            Strict drops nonconformant frames and resets the session in enforce scope; monitor scope
            reports would_drop without blocking. Lost frame boundaries and integrity faults fail
            closed in enforce scope in both parsing modes.
        dpiIcsProtocols:
          type: object
          additionalProperties: false
          properties:
            modbus: {type: boolean}
            dnp3: {type: boolean}
            iec104: {type: boolean}
            cip: {type: boolean}
          description: 'Unknown keys (true or false) return 400: dataplane.dpiIcsProtocols: protocol "<name>" is not supported; supported: modbus, dnp3, iec104, cip'
        dpiMock: {type: boolean}
        dpiMode: {type: string, enum: ['', monitor, enforce], description: Empty inherits monitor mode. Other values are rejected.}
        dpiProtocols: {additionalProperties: {type: boolean}, type: object}
        enforceTable:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_-]{0,247}$'
          description: >-
            nftables table name (inet family). The engine owns inet <enforceTable> for temporary blocks and
            connection revocations and inet <enforceTable>_policy for the firewall policy. Empty selects
            containd; containd_dhcp is reserved for the DHCP redirect table. An nft keyword (for example
            table, inet, ip, accept or drop) is rejected because nft cannot address it as a table name, even
            quoted; keywords are lowercase, so Table is accepted.
        enforcement: {type: boolean}
        nflogGroup: {type: integer}
        nfqueueGroup: {type: integer}
      type: object
      description: Candidate data plane settings; POST stages a replacement. Commit to apply to the engine. Omitted ICS decoder keys are
        enabled; explicit false disables them.
    DHCPLease:
      properties:
        expiresAt: {type: string}
        hostname: {type: string}
        iface: {type: string}
        ip: {type: string}
        mac: {type: string}
      type: object
    DpiEvent:
      properties:
        Attributes:
          type: object
          additionalProperties: true
          description: IdentificationAttributes for identify/identification; passive decoder events carry observation_only and binding_source.
          properties:
            observation_only: {type: boolean}
            binding_source: {type: string, enum: [observation]}
        FlowID: {type: string}
        transportConnectionId: {type: string, description: Local transport connection incarnation established from verified evidence and retained across later evidence failures; independent of FlowID and protocol session handles.}
        correlationStatus: {$ref: '#/components/schemas/TransportCorrelationStatus'}
        Kind: {type: string}
        Proto: {type: string}
        Timestamp: {format: date-time, type: string}
      type: object
    SimulationStatus:
      properties:
        running: {type: boolean}
      type: object
    FirewallConfig:
      properties:
        defaultAction: {type: string, enum: ['', ALLOW, DENY], description: Omitted or empty means DENY.}
        nat: {$ref: '#/components/schemas/NATConfig'}
        rules: {items: {$ref: '#/components/schemas/FirewallRule'}, type: array}
        identityBindings:
          type: array
          maxItems: 4096
          items: {$ref: '#/components/schemas/IdentityMapping'}
          description: Admin-set identity labels of source addresses, each address at most once.
      type: object
    ForwardProxyConfig:
      properties:
        allowedClients: {items: {type: string}, type: array}
        allowedDomains: {items: {type: string}, type: array}
        enabled: {type: boolean}
        listenPort: {type: integer}
        listenZones: {items: {type: string}, type: array}
        logRequests: {type: boolean}
        upstream: {type: string}
      type: object
    Gateway:
      properties:
        address: {type: string}
        alias: {type: string}
        description: {type: string}
        iface: {type: string}
        name: {type: string}
      type: object
    ICAPConfig:
      properties:
        servers: {items: {$ref: '#/components/schemas/ICAPServer'}, type: array}
      type: object
    ICAPServer:
      properties:
        address: {type: string}
        service: {type: string}
        useTls: {type: boolean}
      type: object
    IDSCondition:
      properties:
        all: {items: {$ref: '#/components/schemas/IDSCondition'}, type: array}
        any: {items: {$ref: '#/components/schemas/IDSCondition'}, type: array}
        field: {type: string}
        not: {$ref: '#/components/schemas/IDSCondition'}
        op: {type: string}
        value: {}
      type: object
    IDSConfig:
      properties:
        enabled: {type: boolean}
        ruleGroups: {items: {$ref: '#/components/schemas/RuleGroup'}, type: array, nullable: true}
        rules: {items: {$ref: '#/components/schemas/IDSRule'}, type: array, nullable: true}
      type: object
    IDSRule:
      properties:
        action: {type: string}
        contentMatches: {items: {$ref: '#/components/schemas/ContentMatch'}, type: array}
        conversionNotes: {items: {type: string}, type: array}
        cve: {items: {type: string}, type: array}
        description: {type: string}
        dstAddr: {type: string}
        dstPort: {type: string}
        enabled: {type: boolean}
        id: {type: string}
        kind: {type: string}
        labels: {additionalProperties: {type: string}, type: object}
        message: {type: string}
        mitreAttackIDs: {items: {type: string}, type: array}
        proto:
          type: string
          description: 'Generic and IT names remain valid. Obsolete industrial labels return 400: ids rule <id> proto "<name>" is not supported; supported: modbus, dnp3, iec104, cip. For enip: ids rule <id> proto "enip": EtherNet/IP is decoded as "cip"; match encapsulation commands with enip_command'
        rawSource: {type: string}
        references: {items: {type: string}, type: array}
        severity: {type: string}
        sourceFormat: {type: string}
        srcAddr: {type: string}
        srcPort: {type: string}
        title: {type: string}
        when: {$ref: '#/components/schemas/IDSCondition'}
        yaraStrings: {items: {$ref: '#/components/schemas/YARAString'}, type: array}
      type: object
    Interface:
      properties:
        access: {$ref: '#/components/schemas/InterfaceAccess'}
        addressMode: {type: string}
        addresses: {items: {type: string}, type: array, nullable: true}
        alias: {type: string}
        device: {type: string}
        gateway: {type: string}
        members: {items: {type: string}, type: array, nullable: true}
        name: {type: string}
        parent: {type: string}
        type: {type: string}
        vlanId: {type: integer}
        zone: {type: string}
      type: object
