name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install semgrep==1.178.0
      - name: Verify curated Semgrep scan
        run: bash scripts/semgrep-verify.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11

  release-ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Test release CI gate offline
        run: python3 scripts/release-ci-gate.test.py

  csaf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test CSAF tools
        run: |
          set -euo pipefail
          for test in scripts/csaf/*.test.py; do python3 "$test"; done
      - name: Validate published advisories (schema and mandatory tests)
        run: bash scripts/csaf/validate.sh security/csaf/advisories
      - name: Report advisory coverage for security fixes
        run: python3 scripts/csaf/gate.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/requirements-mkdocs.txt
      - name: Install MkDocs deps
        run: pip install -r docs/requirements-mkdocs.txt
      - name: Build docs
        run: mkdocs build --strict -f docs/mkdocs.yml -d /tmp/containd-docs

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      # The UI prebuild generates the embedded docs and fails without MkDocs.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/requirements-mkdocs.txt
      - name: Install MkDocs deps
        run: pip install -r docs/requirements-mkdocs.txt
      - name: Install deps
        run: npm ci
        working-directory: ui
      - name: Audit
        run: npm audit --audit-level=high
        working-directory: ui
      - name: Lint
        run: npm run lint
        working-directory: ui
      - name: Build script tests
        run: npm test
        working-directory: ui
      - name: Build
        run: npm run build
        working-directory: ui
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Playwright suite
        run: npm run test:routes
        working-directory: ui
        env:
          PLAYWRIGHT_PORT: '3504'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/

  # Docker build + Trivy scan runs in parallel with other jobs (not gated).
  # It does its own full multi-stage build so doesn't need prior job outputs.
  docker:
    runs-on: ubuntu-latest
    env:
      # Empty for Dependabot and fork PRs, which get no repository secrets.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Authenticated pulls avoid Docker Hub's anonymous rate limit on
      # shared runner IPs.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile.mgmt
          push: false
          load: true
          tags: containd/containd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: AV scanning gate smoke
        env:
          COMPOSE_FILE: deploy/docker-compose.smoke.yml:${{ runner.temp }}/av-ci.yml
          SMOKE_PROJECT: containd-av-ci
          SMOKE_BUILD: '0'
        run: |
          source scripts/smoke-lib.sh
          cleanup() {
            local smoke_status=$? logs_status=0 down_status=0
            compose logs --no-color > "$RUNNER_TEMP/av-compose.log" 2>&1 || logs_status=$?
            compose down --volumes --remove-orphans || down_status=$?
            if (( smoke_status != 0 )); then
              exit "$smoke_status"
            fi
            if (( logs_status != 0 )); then
              exit "$logs_status"
            fi
            exit "$down_status"
          }
          trap cleanup EXIT
          cat > "$RUNNER_TEMP/av-ci.yml" <<'YAML'
          services:
            engine:
              image: containd/containd:ci
          YAML
          bash scripts/smoke-av-gate.sh
      - name: Upload AV compose logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: av-compose-logs
          path: ${{ runner.temp }}/av-compose.log
      - name: Quickstart smoke (public compose)
        env:
          COMPOSE_PROJECT_NAME: containd-quickstart-ci
          CONTAIND_IMAGE: containd/containd:ci
          CONTAIND_JWT_SECRET: ci-quickstart-0123456789abcdef0123456789abcdef
        run: bash scripts/smoke-quickstart.sh
      - name: Strict profile smoke
        env:
          COMPOSE_PROJECT_NAME: containd-strict-ci
          CONTAIND_IMAGE: containd/containd:ci
          CONTAIND_JWT_SECRET: ci-strict-0123456789abcdef0123456789abcdef
        run: bash scripts/smoke-strict.sh
      - name: Trivy vulnerability scan
        run: |
          mkdir -p "$RUNNER_TEMP/csaf"
          python3 scripts/csaf/ignore.py --product containd --version "$(cat VERSION)" \
            --output "$RUNNER_TEMP/csaf/ignore.yaml"
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/csaf/ignore.yaml:/trivyignore.yaml:ro" \
            ghcr.io/aquasecurity/trivy:0.62.1 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignorefile /trivyignore.yaml --format table \
            containd/containd:ci
