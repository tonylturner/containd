name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install semgrep==1.178.0
      - name: Verify curated Semgrep scan
        run: bash scripts/semgrep-verify.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Verify go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.11

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/requirements-mkdocs.txt
      - name: Install MkDocs deps
        run: pip install -r docs/requirements-mkdocs.txt
      - name: Build docs
        run: mkdocs build -f docs/mkdocs.yml -d /tmp/containd-docs

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      # The UI prebuild generates the embedded docs and fails without MkDocs.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: docs/requirements-mkdocs.txt
      - name: Install MkDocs deps
        run: pip install -r docs/requirements-mkdocs.txt
      - name: Install deps
        run: npm ci
        working-directory: ui
      - name: Audit
        run: npm audit --audit-level=high
        working-directory: ui
      - name: Lint
        run: npm run lint
        working-directory: ui
      - name: Build script tests
        run: npm test
        working-directory: ui
      - name: Build
        run: npm run build
        working-directory: ui
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ui
      - name: Playwright suite
        run: npm run test:routes
        working-directory: ui
        env:
          PLAYWRIGHT_PORT: '3504'
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report/
            ui/test-results/

  # Docker build + Trivy scan runs in parallel with other jobs (not gated).
  # It does its own full multi-stage build so doesn't need prior job outputs.
  docker:
    runs-on: ubuntu-latest
    env:
      # Empty for Dependabot and fork PRs, which get no repository secrets.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Authenticated pulls avoid Docker Hub's anonymous rate limit on
      # shared runner IPs.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: build/Dockerfile.mgmt
          push: false
          load: true
          tags: containd/containd:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: AV scanning gate smoke
        env:
          COMPOSE_FILE: deploy/docker-compose.smoke.yml:${{ runner.temp }}/av-ci.yml
          SMOKE_PROJECT: containd-av-ci
          SMOKE_BUILD: '0'
        run: |
          source scripts/smoke-lib.sh
          cleanup() {
            local smoke_status=$? logs_status=0 down_status=0
            compose logs --no-color > "$RUNNER_TEMP/av-compose.log" 2>&1 || logs_status=$?
            compose down --volumes --remove-orphans || down_status=$?
            if (( smoke_status != 0 )); then
              exit "$smoke_status"
            fi
            if (( logs_status != 0 )); then
              exit "$logs_status"
            fi
            exit "$down_status"
          }
          trap cleanup EXIT
          cat > "$RUNNER_TEMP/av-ci.yml" <<'YAML'
          services:
            engine:
              image: containd/containd:ci
          YAML
          bash scripts/smoke-av-gate.sh
      - name: Upload AV compose logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: av-compose-logs
          path: ${{ runner.temp }}/av-compose.log
      - name: Quickstart smoke (public compose)
        env:
          COMPOSE_PROJECT_NAME: containd-quickstart-ci
          CONTAIND_IMAGE: containd/containd:ci
          CONTAIND_JWT_SECRET: ci-quickstart-secret
        run: bash scripts/smoke-quickstart.sh
      - name: Trivy vulnerability scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/.trivyignore:/root/.trivyignore:ro \
            ghcr.io/aquasecurity/trivy:0.62.1 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignorefile /root/.trivyignore --format table \
            containd/containd:ci
