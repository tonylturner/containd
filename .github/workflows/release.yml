# NOTE: After the first push, make the GHCR packages public so users can pull
# without authentication: repo → Packages → Package settings → Change visibility → Public.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to promote after it reaches main (for example v0.1.33)"
        required: true
        type: string

permissions:
  contents: write   # needed to attach SBOMs to GitHub releases
  packages: write
  id-token: write   # needed for Cosign keyless signing

env:
  REGISTRY: ghcr.io
  IMAGE_MGMT: ghcr.io/${{ github.repository }}
  IMAGE_ENGINE: ghcr.io/${{ github.repository }}-engine

jobs:
  build-and-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      mgmt-digest: ${{ steps.build-mgmt.outputs.digest }}
      engine-digest: ${{ steps.build-engine.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Validate release version and tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          number='(0|[1-9][0-9]*)'
          prerelease_id="($number|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)"
          semver="${number}\.${number}\.${number}(-${prerelease_id}(\.${prerelease_id})*)?"
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [[ ! "$file_version" =~ ^${semver}$ || ! "$GITHUB_REF_NAME" =~ ^v${semver}$ || ${#tag_version} -gt 128 ]]; then
            echo "Expected VERSION=MAJOR.MINOR.PATCH[-prerelease] and a matching v-prefixed container tag" >&2
            exit 1
          fi
          if [ "$tag_version" != "$file_version" ]; then
            echo "tag version $tag_version does not match VERSION file $file_version" >&2
            exit 1
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: linux/amd64,linux/arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Authenticated base-image pulls avoid Docker Hub's anonymous rate limit.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push mgmt image
        id: build-mgmt
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: build/Dockerfile.mgmt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_MGMT }}:${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push engine image
        id: build-engine
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: build/Dockerfile.engine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_ENGINE }}:${{ steps.meta.outputs.version }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cosign keyless signing (uses GitHub OIDC identity)
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign mgmt image
        run: cosign sign --yes ${{ env.IMAGE_MGMT }}@${{ steps.build-mgmt.outputs.digest }}

      - name: Sign engine image
        run: cosign sign --yes ${{ env.IMAGE_ENGINE }}@${{ steps.build-engine.outputs.digest }}

      # SBOM generation with Syft (CycloneDX 1.6), attached to the signed images
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_MGMT }}@${{ steps.build-mgmt.outputs.digest }}
          output-file: sbom-mgmt.cdx.json
          format: cyclonedx-json

      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_ENGINE }}@${{ steps.build-engine.outputs.digest }}
          output-file: sbom-engine.cdx.json
          format: cyclonedx-json

      - name: Attach SBOM to mgmt image
        run: cosign attach sbom --sbom sbom-mgmt.cdx.json ${{ env.IMAGE_MGMT }}@${{ steps.build-mgmt.outputs.digest }}

      - name: Attach SBOM to engine image
        run: cosign attach sbom --sbom sbom-engine.cdx.json ${{ env.IMAGE_ENGINE }}@${{ steps.build-engine.outputs.digest }}

      - name: Write release image manifest
        run: |
          cat > release-images.txt <<EOF
          mgmt_image=${{ env.IMAGE_MGMT }}:${{ steps.meta.outputs.version }}
          mgmt_digest=${{ steps.build-mgmt.outputs.digest }}
          engine_image=${{ env.IMAGE_ENGINE }}:${{ steps.meta.outputs.version }}
          engine_digest=${{ steps.build-engine.outputs.digest }}
          EOF

      - name: Extract release notes from CHANGELOG
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "missing CHANGELOG entry for ${version}" >&2
            exit 1
          fi

      - name: Package CSAF provider metadata and published advisories
        run: |
          set -euo pipefail
          mkdir -p release-csaf
          cp ui/public/.well-known/csaf/provider-metadata.json release-csaf/provider-metadata.json
          if ls security/csaf/advisories/*.json >/dev/null 2>&1; then
            cp security/csaf/advisories/*.json release-csaf/
          fi
          tar -czf csaf-documents.tgz -C release-csaf .

      - name: Upload SBOMs as release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sboms
          path: |
            sbom-mgmt.cdx.json
            sbom-engine.cdx.json
            release-images.txt
            csaf-documents.tgz

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          files: |
            sbom-mgmt.cdx.json
            sbom-engine.cdx.json
            release-images.txt
            csaf-documents.tgz

  # Both entry points use this job; a dispatch never rebuilds or signs images.
  promote:
    needs: build-and-push
    if: ${{ !cancelled() && (needs.build-and-push.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-latest
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      BUILT_MGMT_DIGEST: ${{ needs.build-and-push.outputs.mgmt-digest }}
      BUILT_ENGINE_DIGEST: ${{ needs.build-and-push.outputs.engine-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Full history is required to prove ancestry, including annotated tags.

      - name: Check promotion eligibility
        id: eligible
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          number='(0|[1-9][0-9]*)'
          prerelease_id="($number|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)"
          semver="${number}\.${number}\.${number}(-${prerelease_id}(\.${prerelease_id})*)?"
          if [[ ! "$RELEASE_TAG" =~ ^v${semver}$ || ${#version} -gt 128 ]]; then
            echo "Expected a v-prefixed MAJOR.MINOR.PATCH[-prerelease] container tag" >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$RELEASE_TAG"
          # Refresh explicit refs; neither the dispatch branch nor the push ref proves main ancestry.
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "Not promoting prerelease $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
            echo "promote=false" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if (( status != 1 )); then
              exit "$status"
            fi
            echo "Not promoting $RELEASE_TAG: $commit is not an ancestor of origin/main" >> "$GITHUB_STEP_SUMMARY"
            echo "promote=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        if: steps.eligible.outputs.promote == 'true'

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: steps.eligible.outputs.promote == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        if: steps.eligible.outputs.promote == 'true'

      - name: Resolve and verify both signed release images and SBOMs
        id: verified
        if: steps.eligible.outputs.promote == 'true'
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.eligible.outputs.commit }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          verify_image() {
            local image="$1" digest="$2" output="$3"
            if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
              digest="$(docker buildx imagetools inspect "$image:${RELEASE_TAG#v}" \
                --format '{{json .Manifest}}' | jq -er '.digest')"
            fi
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Missing or invalid digest for $image" >&2
              exit 1
            fi
            cosign verify \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-github-workflow-sha "$RELEASE_COMMIT" \
              "$image@$digest"
            # Fail closed if an earlier release run signed but did not finish attaching SBOMs.
            cosign download sbom "$image@$digest" > /dev/null
            echo "$output=$digest" >> "$GITHUB_OUTPUT"
          }
          verify_image "$IMAGE_MGMT" "$BUILT_MGMT_DIGEST" mgmt
          verify_image "$IMAGE_ENGINE" "$BUILT_ENGINE_DIGEST" engine

      - name: Promote exact verified digests to latest
        if: steps.eligible.outputs.promote == 'true'
        shell: bash
        env:
          MGMT_DIGEST: ${{ steps.verified.outputs.mgmt }}
          ENGINE_DIGEST: ${{ steps.verified.outputs.engine }}
        run: |
          set -euo pipefail
          # A single index source is copied verbatim, retaining its signatures and SBOM references.
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE_MGMT:latest" "$IMAGE_MGMT@$MGMT_DIGEST"
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE_ENGINE:latest" "$IMAGE_ENGINE@$ENGINE_DIGEST"
