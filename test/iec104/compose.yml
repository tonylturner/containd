# containd milestone B IEC 60870-5-104 truth harness (spec §10.2).
#
# Two endpoint containers (the lib60870 RTU server and control-centre client,
# GPLv3, in the harness-only endpoint image) sit on two disposable networks
# with the branch-built containd firewall routing between them. Management is
# loopback-only: the mgmt and engine ports publish to 127.0.0.1 with an
# ephemeral host port, and there is no host networking.
#
# scripts/smoke-iec104.sh drives this file; it sets IEC104_FIREWALL_IMAGE to
# the branch image it built, a unique project name, and reads the published
# ports back with `docker compose port`. Nothing here binds a fixed host port,
# so two harness runs (or a concurrent US smoke stack) do not collide. The two
# disposable /24 subnets default to 10.233.0.0/24 and 10.234.0.0/24; override
# IEC104_CC_SUBNET and IEC104_RTU_SUBNET (first three octets) for a parallel run
# on a host where those pools are taken.

services:
  firewall:
    image: ${IEC104_FIREWALL_IMAGE:?set IEC104_FIREWALL_IMAGE to the branch-built containd image}
    pull_policy: never
    user: "0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      - CONTAIND_MODE=all
      # Engine and mgmt listen on all container interfaces but are published
      # only to 127.0.0.1 (below), so management stays loopback-only on the host.
      - CONTAIND_ENGINE_ADDR=:8081
      - CONTAIND_MGMT_ADDR=:18080
      - CONTAIND_MGMT_HTTPS_ADDR=:18443
      - CONTAIND_ENGINE_URL=http://127.0.0.1:8081
      - CONTAIND_ADMIN_TOKEN=${IEC104_ADMIN_TOKEN:-devtoken}
      - CONTAIND_LAB_MODE=1
      - CONTAIND_JWT_SECRET=
      - CONTAIND_CONFIG_DB=/data/config.db
      - CONTAIND_AUDIT_DB=/data/audit.db
      - CONTAIND_USERS_DB=/data/users.db
    command: ["all"]
    networks:
      cc_net:
        ipv4_address: ${IEC104_CC_SUBNET:-10.233.0}.2
      rtu_net:
        ipv4_address: ${IEC104_RTU_SUBNET:-10.234.0}.2
    ports:
      - "127.0.0.1::8081"
      - "127.0.0.1::18080"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "/usr/bin/containd", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30

  rtu:
    image: ${IEC104_ENDPOINT_IMAGE:?set IEC104_ENDPOINT_IMAGE to the harness endpoint image}
    pull_policy: never
    cap_add:
      - NET_ADMIN
    environment:
      - STATE_FILE=/state/rtu.json
    command: ["rtu"]
    networks:
      rtu_net:
        ipv4_address: ${IEC104_RTU_SUBNET:-10.234.0}.10
    volumes:
      - rtu_state:/state
    depends_on:
      firewall:
        condition: service_healthy

  cc:
    image: ${IEC104_ENDPOINT_IMAGE:?set IEC104_ENDPOINT_IMAGE to the harness endpoint image}
    pull_policy: never
    cap_add:
      - NET_ADMIN
    # Idle container: the smoke script sets routes, then runs `iec104ep cc`
    # and `iec104ep cmd ...` inside it via `compose exec`. Idling avoids a
    # connect race before the default route through the firewall exists.
    entrypoint: ["sh", "-c", "exec tail -f /dev/null"]
    networks:
      cc_net:
        ipv4_address: ${IEC104_CC_SUBNET:-10.233.0}.10
    depends_on:
      firewall:
        condition: service_healthy

networks:
  cc_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${IEC104_CC_SUBNET:-10.233.0}.0/24
  rtu_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${IEC104_RTU_SUBNET:-10.234.0}.0/24

volumes:
  rtu_state:
