services:
  engine:
    image: ${RA_IMAGE:?set RA_IMAGE}
    user: "0"
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      CONTAIND_LAB_MODE: "1"
      CONTAIND_JWT_SECRET: remote-access-smoke-local-only
      CONTAIND_ENGINE_URL: http://127.0.0.1:8081
      CONTAIND_CONFIG_DB: /data/config.db
      CONTAIND_AUDIT_DB: /data/audit.db
      CONTAIND_USERS_DB: /data/users.db
      CONTAIND_AUTO_WAN_SUBNET: 10.250.1.0/24
      CONTAIND_AUTO_LAN1_SUBNET: 10.250.2.0/24
    command: ["all"]
    volumes: ["data:/data"]
    ports: ["127.0.0.1::8443"]
    networks:
      wan:
        ipv4_address: 10.250.1.2
      lan:
        ipv4_address: 10.250.2.2
  client_a:
    image: ${RA_CLIENT_IMAGE:?set RA_CLIENT_IMAGE}
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes: ["${RA_WORK:?set RA_WORK}:/work"]
    networks:
      wan:
        ipv4_address: 10.250.1.3
  client_b:
    image: ${RA_CLIENT_IMAGE}
    cap_add: [NET_ADMIN, NET_RAW]
    devices: ["/dev/net/tun:/dev/net/tun"]
    volumes: ["${RA_WORK}:/work"]
    networks:
      wan:
        ipv4_address: 10.250.1.4
  peer:
    image: ${RA_CLIENT_IMAGE}
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ["${RA_WORK}:/work"]
    networks:
      wan:
        ipv4_address: 10.250.1.5
  target:
    image: ${RA_CLIENT_IMAGE}
    cap_add: [NET_ADMIN, NET_RAW]
    networks:
      lan:
        ipv4_address: 10.250.2.3
  inspect:
    image: ${RA_CLIENT_IMAGE}
    cap_add: [NET_ADMIN, NET_RAW]
    network_mode: service:engine
    depends_on: [engine]
  store:
    profiles: [maintenance]
    image: ${RA_CLIENT_IMAGE}
    network_mode: none
    volumes:
      - data:/data
      - ./stored-fault.py:/stored-fault.py:ro
    command: ["python3", "/stored-fault.py"]
volumes:
  data:
networks:
  wan:
    ipam:
      config: [{subnet: 10.250.1.0/24}]
  lan:
    ipam:
      config: [{subnet: 10.250.2.0/24}]
