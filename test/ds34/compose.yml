services:
  engine:
    image: ${DS34_IMAGE:?}
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE, SYS_PTRACE]
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      CONTAIND_ENFORCE_ENABLED: "1"
      CONTAIND_LAB_MODE: "1"
      CONTAIND_JWT_SECRET: "isolated-pairing-smoke-secret-not-for-production"
      CONTAIND_ADMIN_TOKEN: devtoken
      CONTAIND_MGMT_ADDR: ":18080"
      CONTAIND_ENGINE_ADDR: "127.0.0.1:8081"
      CONTAIND_ENGINE_URL: "http://127.0.0.1:8081"
      CONTAIND_CONFIG_DB: /data/config.db
      CONTAIND_USERS_DB: /data/users.db
      CONTAIND_AUDIT_DB: /data/audit.db
      CONTAIND_MGMT_RESERVATION: '${DS34_RESERVATION:?}'
    volumes: [data:/data, '${DS34_RESULTS:?}:/results']
    networks:
      lan:
        interface_name: lan1
        ipv4_address: ${DS34_LAN:?}.2
      wan:
        interface_name: wan
        ipv4_address: ${DS34_WAN:?}.2
  master:
    image: ${DS34_IMAGE:?}
    entrypoint: [sleep, infinity]
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ['${DS34_RESULTS:?}:/results', '../../test:/fixtures:ro']
    networks:
      lan:
        ipv4_address: ${DS34_LAN:?}.10
  outstation:
    image: ${DS34_IMAGE:?}
    entrypoint: [python3, /fixtures/ds34/peers/tcp/peer.py, server]
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ['${DS34_RESULTS:?}:/results', '../../test:/fixtures:ro']
    networks:
      wan:
        ipv4_address: ${DS34_WAN:?}.10
  upstream:
    image: ${DS34_PEER_IMAGE:?}
    cap_add: [NET_ADMIN, NET_RAW]
    volumes: ['${DS34_RESULTS:?}:/results']
    networks:
      wan:
        ipv4_address: ${DS34_WAN:?}.11
volumes:
  data:
networks:
  lan:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${DS34_LAN:?}.0/24
  wan:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${DS34_WAN:?}.0/24
