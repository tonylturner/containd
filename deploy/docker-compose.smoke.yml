services:
  engine:
    build:
      context: ..
      dockerfile: build/Dockerfile.mgmt
    image: containd/containd:dev
    user: "0"
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    # The engine API keeps the all-mode loopback default; the smoke scripts
    # reach it with `docker compose exec`.
    environment:
      - CONTAIND_MGMT_ADDR=:18080
      - CONTAIND_MGMT_HTTPS_ADDR=:18443
      - CONTAIND_ENGINE_URL=http://127.0.0.1:8081
      - CONTAIND_ADMIN_TOKEN=devtoken
      - CONTAIND_LAB_MODE=1
      - CONTAIND_JWT_SECRET=
      - CONTAIND_CONFIG_DB=/data/config.db
      - CONTAIND_AUDIT_DB=/data/audit.db
      - CONTAIND_USERS_DB=/data/users.db
    volumes:
      - ../test/data-smoke:/data
      - ../ui/out:/var/lib/ngfw/ui:ro
    networks:
      wan_net:
        ipv4_address: 172.30.0.2
      lan_net:
        ipv4_address: 172.31.0.2
    command: ["all"]
    ports:
      - "18080:18080"
      - "18443:18443"
      - "12222:2222"

  lan_client:
    image: python:3-alpine
    command: ["sleep", "infinity"]
    user: "0"
    cap_add:
      - NET_ADMIN
    volumes:
      - ../test/data-smoke/forward:/opt/forward:ro
      - ../test/data-smoke/av:/opt/av:ro
    networks:
      lan_net:
        ipv4_address: 172.31.0.3
    depends_on:
      - engine

  lan_target:
    image: python:3-alpine
    command: ["python", "/opt/forward/echo.py", "lan_target", "80", "22"]
    user: "0"
    cap_add:
      - NET_ADMIN
    volumes:
      - ../test/data-smoke/forward:/opt/forward:ro
    networks:
      lan_net:
        ipv4_address: 172.31.0.4
    depends_on:
      - engine

  wan_server:
    image: python:3-alpine
    command: ["python", "/opt/forward/echo.py", "wan_server", "8080", "8082"]
    user: "0"
    cap_add:
      - NET_ADMIN
    volumes:
      - ../test/data-smoke/forward:/opt/forward:ro
    networks:
      wan_net:
        ipv4_address: 172.30.0.3
    depends_on:
      - engine

  ot_client:
    image: python:3-alpine
    command: ["sleep", "infinity"]
    user: "0"
    cap_add:
      - NET_ADMIN
    volumes:
      - ../test/data-smoke/modbus:/opt/modbus:ro
    networks:
      lan_net:
        ipv4_address: 172.31.0.5
    depends_on:
      - engine

  modbus_server:
    image: python:3-alpine
    command: ["python", "/opt/modbus/server.py"]
    user: "0"
    cap_add:
      - NET_ADMIN
    volumes:
      - ../test/data-smoke/modbus:/opt/modbus:ro
    networks:
      wan_net:
        ipv4_address: 172.30.0.4
    depends_on:
      - engine

  # Origins for the scanning-gate smoke (scripts/smoke-av-gate.sh): av_server
  # on the WAN side serves the EICAR and clean objects on the selected port
  # 8080 and the unselected port 8082; av_target is the LAN target of its
  # inbound port forward. Both log the client address they observe.
  av_server:
    image: python:3-alpine
    command: ["python", "/opt/av/server.py", "av_server", "8080", "8082"]
    user: "0"
    cap_add:
      - NET_ADMIN
    volumes:
      - ../test/data-smoke/av:/opt/av:ro
    networks:
      wan_net:
        ipv4_address: 172.30.0.11
    depends_on:
      - engine

  av_target:
    image: python:3-alpine
    command: ["python", "/opt/av/server.py", "av_target", "80"]
    user: "0"
    cap_add:
      - NET_ADMIN
    volumes:
      - ../test/data-smoke/av:/opt/av:ro
    networks:
      lan_net:
        ipv4_address: 172.31.0.11
    depends_on:
      - engine

networks:
  wan_net:
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/24
  lan_net:
    ipam:
      driver: default
      config:
        - subnet: 172.31.0.0/24
