# Isolated, routed, no-NAT measurement topology. Invoke through perf-dataplane.sh.
services:
  appliance:
    image: ${PERF_APPLIANCE_IMAGE:?use scripts/perf-dataplane.sh}
    platform: linux/arm64
    cpus: 4
    mem_limit: 2g
    user: '0'
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
    environment:
      CONTAIND_PROFILE: training
      CONTAIND_MGMT_ADDR: ':18080'
      CONTAIND_MGMT_HTTPS_ADDR: ':18443'
      CONTAIND_ENGINE_URL: http://127.0.0.1:8081
      CONTAIND_ADMIN_TOKEN: devtoken
      CONTAIND_LAB_MODE: '1'
      CONTAIND_JWT_SECRET: ''
    volumes: [data:/data]
    networks:
      lan:
        interface_name: lan1
        ipv4_address: ${PERF_LAN_ENGINE:?}
      wan:
        interface_name: wan
        ipv4_address: ${PERF_WAN_ENGINE:?}
    command: [all]
    ports:
      - target: 18080
        host_ip: 127.0.0.1
        published: '0'
        protocol: tcp
  client:
    image: ${PERF_HELPER_IMAGE:?}
    platform: linux/arm64
    cpus: 2
    mem_limit: 512m
    cap_add: [NET_ADMIN]
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    entrypoint: [sleep, infinity]
    volumes:
      - ${PERF_RESULTS:?}:/results
    networks:
      lan:
        interface_name: eth0
        ipv4_address: ${PERF_LAN_CLIENT:?}
  peer:
    image: ${PERF_HELPER_IMAGE:?}
    platform: linux/arm64
    cpus: 2
    mem_limit: 512m
    cap_add: [NET_ADMIN, NET_RAW]
    ulimits:
      nofile: {soft: 8192, hard: 8192}
    command: [-mode, peer]
    volumes:
      - ${PERF_RESULTS:?}:/results
    networks:
      wan:
        interface_name: eth0
        ipv4_address: ${PERF_WAN_PEER:?}
networks:
  lan:
    internal: true
    driver_opts: {com.docker.network.driver.mtu: '1500'}
    ipam:
      config:
        - subnet: ${PERF_LAN_SUBNET:?}
  wan:
    internal: true
    driver_opts: {com.docker.network.driver.mtu: '1500'}
    ipam:
      config:
        - subnet: ${PERF_WAN_SUBNET:?}
volumes:
  data:
